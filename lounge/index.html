<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>쉬는 시간 라운지</title>
<meta name="description" content="반 친구들과 쉬는 시간에 들어와 쉬는 온라인 힐링 방: 불멍, 물멍, 비 오는 창가">
<meta name="theme-color" content="#14121c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
:root{--ink:#fff7ee;--dim:rgba(255,247,238,.68);--glass:rgba(20,16,30,.62);--edge:rgba(255,255,255,.16);--sun:#ffb347;--sun2:#ffd59a;--bg:#14121c;
--font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--hand:"Gaegu","IBM Plex Sans KR",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.screen{position:fixed;inset:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));z-index:3}
.card{width:min(560px,100%);border-radius:26px;padding:26px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--hand);font-weight:700;font-size:clamp(40px,9vw,58px);line-height:1;margin:0;letter-spacing:-.01em}
h2{font-family:var(--hand);font-weight:700;font-size:32px;margin:0;line-height:1.1}
p{margin:0;line-height:1.55}
.dim{color:var(--dim)}
label{font-size:14px;color:var(--dim);display:block;margin-bottom:6px}
input[type=text]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:1px solid var(--edge);background:rgba(0,0,0,.3);color:var(--ink)}
.pill{border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:17px}
.pill.sun{background:var(--sun);color:#2b1606}
.pill.ghost{background:rgba(255,255,255,.1);border:1px solid var(--edge)}
.pill.small{padding:8px 14px;font-size:15px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.sw[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.err{color:#ffb4a8;font-size:14px;min-height:1em}
.note{font-size:12.5px;color:var(--dim);line-height:1.5}
/* 로비 */
#lobby .card{width:min(980px,100%)}
.lobhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.room{position:relative;border:0;border-radius:22px;overflow:hidden;aspect-ratio:4/5;padding:0;text-align:left;color:#fff;transition:transform .15s}
.room:hover{transform:translateY(-4px)}
.room canvas{position:absolute;inset:0;width:100%;height:100%}
.room .lab{position:absolute;left:0;right:0;bottom:0;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,.65));display:flex;flex-direction:column;gap:2px}
.room b{font-family:var(--hand);font-size:30px;line-height:1}
.room small{font-size:13px;color:rgba(255,255,255,.8)}
.room .cnt{position:absolute;top:12px;right:12px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.45)}
@media (max-width:720px){.rooms{grid-template-columns:1fr}.room{aspect-ratio:16/7}}
#qrbox{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(8,6,12,.7);padding:16px}
#qrbox .card{align-items:center;text-align:center;width:min(440px,100%)}
#qrbox .q{background:#fff;border-radius:18px;padding:12px;width:min(300px,80vw)}
#qrbox .q svg{width:100%;height:auto;display:block}
#qrbox .code{font-family:var(--hand);font-size:40px;color:var(--sun2)}
/* 방 HUD */
.hud{position:fixed;z-index:5}
#topL{left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;align-items:center;border-radius:999px;padding:6px 8px 6px 6px}
#topL b{font-family:var(--hand);font-size:24px;padding-right:6px}
#topR{right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;align-items:center}
#who{border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700}
#acts{right:max(12px,env(safe-area-inset-right));top:max(66px,calc(env(safe-area-inset-top) + 60px));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#acts button{border-radius:999px;padding:9px 16px;font-weight:700;font-size:15px;border:1px solid var(--edge);background:rgba(20,16,30,.62);backdrop-filter:blur(10px)}
#acts button.on{background:var(--sun);color:#2b1606}
#acts button:disabled{opacity:.5}
#chatbar{left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:min(560px,calc(100% - 24px));border-radius:20px;padding:8px;display:flex;flex-direction:column;gap:6px}
#chatbar form{display:flex;gap:6px}
#chatbar input{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 12px;border-radius:12px;border:1px solid var(--edge);background:rgba(0,0,0,.3);color:var(--ink)}
#chatbar .quick{display:flex;gap:6px;flex-wrap:wrap}
#chatbar .quick button{font-size:15px;padding:4px 10px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.08)}
#chatbar .send{font-weight:700;padding:0 16px;border-radius:12px;border:0;background:var(--sun);color:#2b1606}
#chatbar .send:disabled{opacity:.5}
#chatmini{font-size:12px;color:var(--dim);padding:0 4px;min-height:0}
#hint{left:50%;top:max(64px,calc(env(safe-area-inset-top) + 58px));max-width:calc(100% - 200px);overflow:hidden;text-overflow:ellipsis;transform:translateX(-50%);border-radius:999px;padding:7px 16px;font-size:13px;color:var(--dim);white-space:nowrap;transition:opacity .6s}
#toast{left:50%;top:40%;transform:translate(-50%,-50%);border-radius:20px;padding:16px 22px;text-align:center;font-weight:700;font-size:18px;pointer-events:none;transition:opacity .4s}
#net{left:50%;transform:translateX(-50%);top:max(110px,calc(env(safe-area-inset-top) + 104px));border-radius:999px;padding:6px 14px;font-size:13px;color:#ffd0c8}
@media (max-width:560px){#topL b{display:none}#hint{max-width:calc(100% - 24px);top:auto;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 104px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<section class="screen" id="intro">
  <form class="card glass" id="introForm" autocomplete="off">
    <p class="dim" style="font-size:14px">인공지능 히어로 · 쉬는 시간</p>
    <h1>쉬는 시간 라운지</h1>
    <p class="dim">우리 반 친구들끼리만 만나는 힐링 방이에요. 모닥불을 보고, 물고기를 보고, 빗소리를 들으며 쉬어 가요.</p>
    <div><label for="cls">반 코드 (선생님이 알려 준 코드)</label><input type="text" id="cls" maxlength="16" placeholder="예: 해솔중2-3"></div>
    <div><label for="nick">별명 (실명 말고!)</label><input type="text" id="nick" maxlength="8" placeholder="예: 졸린판다"></div>
    <div><label>내 캐릭터 색</label><div class="swatches" id="sws"></div></div>
    <div class="err" id="introErr"></div>
    <button class="pill sun" type="submit">라운지 들어가기</button>
    <p class="note">같은 반 코드를 넣은 친구들끼리만 서로 보여요. 공개 서버를 거쳐 전달되니 이름·학교·전화번호 같은 개인정보는 쓰지 마세요.</p>
  </form>
</section>

<section class="screen" id="lobby" hidden>
  <div class="card glass">
    <div class="lobhead">
      <div><p class="dim" id="lobCls" style="font-size:14px"></p><h2>어디서 쉴까?</h2></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="pill ghost small" id="qrBtn">📱 우리 반 초대 QR</button><button class="pill ghost small" id="reBtn">✏️ 별명·반 바꾸기</button></div>
    </div>
    <div class="rooms" id="rooms"></div>
    <p class="note" id="lobNet"></p>
  </div>
</section>

<div id="qrbox" hidden><div class="card glass"><h2>우리 반 라운지</h2><div class="q" id="qr"></div><div class="code" id="qrCode"></div><p class="note" id="qrUrl" style="word-break:break-all"></p><button class="pill sun" id="qrClose">닫기</button></div></div>

<div class="hud glass" id="topL" hidden><button class="pill ghost small" id="backBtn" aria-label="라운지로 나가기">← 나가기</button><b id="roomName"></b></div>
<div class="hud" id="topR" hidden><span class="glass" id="who">1명</span><button class="pill ghost small glass" id="sndBtn">🔊 소리 켜짐</button></div>
<div class="hud glass" id="hint" hidden></div>
<div class="hud glass" id="net" hidden></div>
<div class="hud" id="acts" hidden></div>
<div class="hud glass" id="chatbar" hidden>
  <div class="quick" id="quick"></div>
  <form id="chatForm" autocomplete="off"><input id="chatIn" maxlength="30" placeholder="한마디 (30자, 바른 말로!)" aria-label="채팅 입력"><button class="send" id="chatSend" type="submit">보내기</button></form>
  <div id="chatmini"></div>
</div>
<div class="hud glass" id="toast" hidden></div>

<script>
"use strict";
/* ================= 공통 ================= */
const W=1600,H=900;
const COLORS=["#ff6b6b","#ffa94d","#ffd43b","#69db7c","#38d9a9","#4dabf7","#9775fa","#f783ac","#c08457","#e9ecef"];
const ROOMS={
  fire:{name:"불멍 캠프파이어",sub:"모닥불 앞에 앉아 장작을 넣어요",floor:[600,785],quick:["🔥","🍡","😴","👍","🌙"]},
  sea:{name:"물멍 수족관",sub:"물고기를 바라보며 멍하니",floor:[640,785],quick:["🐟","🫧","😍","👍","🐢"]},
  rain:{name:"비 오는 창가",sub:"빗소리 들으며 김 서린 창에 낙서",floor:[655,785],quick:["☔","☕","😌","👍","🐱"]}
};
const $=id=>document.getElementById(id);
const rid=()=>Math.random().toString(36).slice(2,10);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const BADW=["시발","씨발","씨바","시바","ㅅㅂ","ㅆㅂ","병신","ㅂㅅ","개새","새끼","ㅅㄲ","지랄","ㅈㄹ","존나","졸라","ㅈㄴ","닥쳐","꺼져","미친","ㅁㅊ","썅","fuck","shit","bitch"];
function clean(m,max=30){ m=String(m||"").replace(/[\u0000-\u001f<>]/g,"").replace(/\s+/g," ").trim().slice(0,max); let low=m.toLowerCase();
  for(const w of BADW){ let i; while((i=low.indexOf(w))>=0){ m=m.slice(0,i)+"♥".repeat(w.length)+m.slice(i+w.length); low=m.toLowerCase(); } } return m; }
function h32(s){ let h=0x811c9dc5; for(const ch of s){ h^=ch.codePointAt(0); h=Math.imul(h,0x01000193)>>>0; } return h.toString(36); }
let toastT=0; function toast(msg,ms=1800){ const t=$("toast"); t.textContent=msg; t.hidden=false; t.style.opacity=1; clearTimeout(toastT); toastT=setTimeout(()=>{t.style.opacity=0; setTimeout(()=>t.hidden=true,400)},ms); }
const ME={id:"u"+rid(),n:"",c:COLORS[Math.floor(Math.random()*9)],cls:"",key:""};
try{ const s=JSON.parse(localStorage.getItem("lounge-me")||"null"); if(s){ ME.n=s.n||""; ME.c=COLORS.includes(s.c)?s.c:ME.c; ME.cls=s.cls||""; } }catch(e){}

/* ================= 실시간 연결 (공개 MQTT, 반 코드별 주제) ================= */
const TOP="aihero-lounge-v1/";
const BROKERS=[{url:"wss://broker.emqx.io:8084/mqtt"},{url:"wss://broker.hivemq.com:8884/mqtt"},{url:"wss://public.cloud.shiftr.io",username:"public",password:"public"}];
const net={clients:[],topics:new Set(),seq:0,last:new Map(),eids:new Set(),handler:null,up:false};
function netStart(){
  if(net.clients.length) return;
  if(typeof mqtt==="undefined"){ netWarn("실시간 연결 도구를 불러오지 못했어요. 새로고침해 보세요."); return; }
  net.clients=BROKERS.map(b=>{ let c; try{ c=mqtt.connect(b.url,{username:b.username,password:b.password,clientId:"lg_"+rid(),reconnectPeriod:3000,connectTimeout:9000,keepalive:30,clean:true}); }catch(e){ return null; }
    c.on("connect",()=>{ net.up=true; netWarn(""); for(const t of net.topics) c.subscribe(t,{qos:0}); });
    c.on("message",(t,m)=>{ let d; try{ d=JSON.parse(m.toString()); }catch(e){ return; } onNet(t,d); });
    c.on("error",()=>{}); return c; }).filter(Boolean);
  setTimeout(()=>{ if(!net.up) netWarn("친구들과 연결이 안 돼요. 학교 와이파이가 막고 있을 수 있어요. (혼자서는 쉴 수 있어요)"); },10000);
}
function netWarn(m){ $("net").textContent=m; $("net").hidden=!m||!document.body.classList.contains("inroom"); $("lobNet").textContent=m; }
function sub(t){ if(net.topics.has(t)) return; net.topics.add(t); for(const c of net.clients) if(c.connected) c.subscribe(t,{qos:0}); }
function unsub(t){ if(!net.topics.delete(t)) return; for(const c of net.clients) if(c.connected) try{c.unsubscribe(t)}catch(e){} }
function pub(t,obj){ obj.id=ME.id; obj.q=++net.seq; const m=JSON.stringify(obj); for(const c of net.clients) if(c&&c.connected) try{c.publish(t,m,{qos:0})}catch(e){} }
function onNet(t,d){
  if(!d||typeof d!=="object"||typeof d.id!=="string"||d.id===ME.id) return;
  const k=t+"|"+d.id, q=+d.q||0;                     // 같은 메시지가 서버 여러 곳에서 와도 한 번만
  if(q<=(net.last.get(k)||0)) return; net.last.set(k,q);
  if(net.handler) net.handler(t,d);
}
const tPres=()=>TOP+ME.key+"/p", tRoom=r=>TOP+ME.key+"/r/"+r;

/* ================= 소리 (내장 합성) ================= */
const snd={ctx:null,on:true,master:null,nodes:[],timers:[]};
try{ snd.on=localStorage.getItem("lounge-snd")!=="0"; }catch(e){}
function audio(){ if(!snd.ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; snd.ctx=new AC(); snd.master=snd.ctx.createGain(); snd.master.gain.value=snd.on?.7:0; snd.master.connect(snd.ctx.destination); } if(snd.ctx.state==="suspended") snd.ctx.resume(); return snd.ctx; }
function noiseBuf(ctx,kind){ const n=ctx.sampleRate*3, b=ctx.createBuffer(1,n,ctx.sampleRate), d=b.getChannelData(0); let last=0;
  for(let i=0;i<n;i++){ const w=Math.random()*2-1; if(kind==="brown"){ last=(last+.02*w)/1.02; d[i]=last*3.2; } else d[i]=w; } return b; }
function loopNoise(kind,type,freq,q,vol){ const ctx=audio(); if(!ctx) return; const s=ctx.createBufferSource(); s.buffer=noiseBuf(ctx,kind); s.loop=true;
  const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q; const g=ctx.createGain(); g.gain.value=vol; s.connect(f); f.connect(g); g.connect(snd.master); s.start(); snd.nodes.push(s); return {s,f,g}; }
function blip(freq,dur,vol,type="sine",slide=0){ const ctx=snd.ctx; if(!ctx||!snd.on) return; const t=ctx.currentTime, o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(freq,t); if(slide) o.frequency.exponentialRampToValueAtTime(freq*slide,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g); g.connect(snd.master); o.start(t); o.stop(t+dur+.05); }
function crack(vol=.25){ const ctx=snd.ctx; if(!ctx||!snd.on) return; const s=ctx.createBufferSource(), n=Math.floor(ctx.sampleRate*.04), b=ctx.createBuffer(1,n,ctx.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3); s.buffer=b; const f=ctx.createBiquadFilter(); f.type="highpass"; f.frequency.value=1200+Math.random()*2500; const g=ctx.createGain(); g.gain.value=vol*Math.random(); s.connect(f); f.connect(g); g.connect(snd.master); s.start(); }
function thunder(){ const ctx=snd.ctx; if(!ctx||!snd.on) return; const s=ctx.createBufferSource(); s.buffer=noiseBuf(ctx,"brown"); const f=ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=180; const g=ctx.createGain(), t=ctx.currentTime;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(1.6,t+.25); g.gain.exponentialRampToValueAtTime(.0001,t+3.2); s.connect(f); f.connect(g); g.connect(snd.master); s.start(t); s.stop(t+3.4); }
function ambient(room){ stopAmbient(); if(!audio()) return;
  if(room==="fire"){ loopNoise("brown","lowpass",320,.7,.55); loopNoise("white","bandpass",900,.6,.02);
    const tick=()=>{ crack(.22); if(Math.random()<.3) setTimeout(()=>crack(.14),40); snd.timers.push(setTimeout(tick,rnd(60,420)/Fire.level)); }; tick();
    const cricket=()=>{ for(let i=0;i<3;i++) setTimeout(()=>blip(4300,.05,.012,"sine"),i*70); snd.timers.push(setTimeout(cricket,rnd(2500,6000))); }; cricket(); }
  if(room==="sea"){ loopNoise("brown","lowpass",240,.5,.7); const hum=loopNoise("white","bandpass",420,4,.015);
    const bub=()=>{ blip(rnd(500,900),.12,.03,"sine",2.2); snd.timers.push(setTimeout(bub,rnd(500,2500))); }; bub(); }
  if(room==="rain"){ loopNoise("white","bandpass",1600,.5,.16); loopNoise("white","highpass",5000,.3,.03); loopNoise("brown","lowpass",400,.6,.25);
    const drip=()=>{ blip(rnd(1400,2600),.06,.025,"sine",.6); snd.timers.push(setTimeout(drip,rnd(300,1600))); }; drip(); }
}
function stopAmbient(){ snd.nodes.forEach(n=>{try{n.stop()}catch(e){}}); snd.nodes=[]; snd.timers.forEach(clearTimeout); snd.timers=[]; }
function setSound(on){ snd.on=on; try{localStorage.setItem("lounge-snd",on?"1":"0")}catch(e){} if(snd.master) snd.master.gain.value=on?.7:0; $("sndBtn").textContent=on?"🔊 소리 켜짐":"🔈 소리 꺼짐"; }

/* ================= 캔버스 ================= */
const cv=$("cv"), g=cv.getContext("2d");
let DPR=1, SC=1, VW=W, camX=0, camT=0;
function resize(){ DPR=Math.min(1.75,window.devicePixelRatio||1); cv.width=Math.round(innerWidth*DPR); cv.height=Math.round(innerHeight*DPR);
  SC=innerHeight/H; if(innerWidth/SC>W*1.35) SC=innerWidth/(W*1.35); VW=innerWidth/SC; }
addEventListener("resize",resize); resize();
function off(w,h,draw){ const c=document.createElement("canvas"); c.width=w; c.height=h; draw(c.getContext("2d"),w,h); return c; }
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function seeded(seed){ let s=seed>>>0; return ()=>{ s=Math.imul(s^s>>>15,1|s); s^=s+Math.imul(s^s>>>7,61|s); return ((s^s>>>14)>>>0)/4294967296; }; }

/* ================= 아바타 ================= */
function drawAvatar(c,p,t,isMe){
  const s=.78+((p.y-600)/260)*.42, x=p.x, y=p.y, walk=p.walk||0, bob=walk?Math.abs(Math.sin(t/110+p.ph))*5:Math.sin(t/700+p.ph)*1.4;

  c.fillStyle="rgba(0,0,0,.28)"; c.beginPath(); c.ellipse(0,0,30,9,0,0,7); c.fill();
  if(isMe){ c.strokeStyle="rgba(255,179,71,.85)"; c.lineWidth=3; c.beginPath(); c.ellipse(0,0,38,12,0,0,7); c.stroke(); }
  const ft=walk?Math.sin(t/110+p.ph)*8:0;
  c.fillStyle="#3b2c35"; c.beginPath(); c.ellipse(-12+ft,-5,10,7,0,0,7); c.ellipse(12-ft,-5,10,7,0,0,7); c.fill();
  c.translate(0,-bob);
  c.fillStyle=p.c; c.beginPath(); c.ellipse(0,-34,26,30,0,0,7); c.fill();
  c.fillStyle="rgba(255,255,255,.18)"; c.beginPath(); c.ellipse(-8,-44,9,13,-.3,0,7); c.fill();
  c.fillStyle=p.c; const sw=walk?Math.sin(t/110+p.ph)*.5:Math.sin(t/900+p.ph)*.08;
  for(const sd of [-1,1]){ c.save(); c.translate(sd*24,-48); c.rotate(sd*(.35+sw*sd)); c.beginPath(); c.ellipse(0,14,8,15,0,0,7); c.fill(); c.restore(); }
  if(p.m!=null&&p.m>=0){ c.save(); c.translate(26,-46); c.rotate(-.9); c.strokeStyle="#8b5a2b"; c.lineWidth=3; c.beginPath(); c.moveTo(0,0); c.lineTo(0,-62); c.stroke();
    const k=p.m, col=k<.5?`rgb(${255},${250-k*60},${235-k*120})`:k<1?`rgb(${255-(k-.5)*80},${220-(k-.5)*160},${175-(k-.5)*200})`:"#5a3a22";
    c.fillStyle=col; rr(c,-9,-80,18,22,6); c.fill(); c.restore(); }
  c.fillStyle="#ffe0c7"; c.beginPath(); c.arc(0,-82,27,0,7); c.fill();
  c.fillStyle="#3b2c35"; c.beginPath(); c.arc(0,-86,28,Math.PI*1.04,Math.PI*1.96); c.quadraticCurveTo(10,-96,-26,-84); c.fill();
  c.beginPath(); c.arc(6,-110,7,0,7); c.fill();
  const blink=((t/1000+p.ph*3)%4)<.12;
  c.fillStyle="#2a1c24"; if(blink){ c.fillRect(-12,-80,8,2.5); c.fillRect(6,-80,8,2.5); } else { c.beginPath(); c.arc(-8,-79,4,0,7); c.arc(10,-79,4,0,7); c.fill(); c.fillStyle="#fff"; c.beginPath(); c.arc(-7,-80.5,1.4,0,7); c.arc(11,-80.5,1.4,0,7); c.fill(); }
  c.fillStyle="rgba(255,120,120,.4)"; c.beginPath(); c.ellipse(-17,-70,6,3.5,0,0,7); c.ellipse(19,-70,6,3.5,0,0,7); c.fill();
  c.restore();
  // 이름표 (뒤집지 않음)
  c.save(); c.translate(x,y); c.scale(s,s);
  c.font="700 17px 'IBM Plex Sans KR'"; const tw=c.measureText(p.n).width+20;
  c.fillStyle=isMe?"rgba(255,179,71,.95)":"rgba(15,10,20,.6)"; rr(c,-tw/2,10,tw,26,13); c.fill();
  c.fillStyle=isMe?"#2b1606":"#fff"; c.textAlign="center"; c.textBaseline="middle"; c.fillText(p.n,0,23.5);
  if(p.say&&performance.now()-p.sayT<6000){ const a=Math.min(1,(6000-(performance.now()-p.sayT))/500); bubble(c,p.say,0,-128-bob,a); }
  c.restore();
}
function bubble(c,text,x,y,alpha){
  c.save(); c.globalAlpha=alpha; c.font="700 22px 'IBM Plex Sans KR'";
  const chars=[...text]; const lines=[""]; for(const ch of chars){ if(c.measureText(lines[lines.length-1]+ch).width>230){ if(lines.length===2){ lines[1]=lines[1].slice(0,-1)+"…"; break; } lines.push(""); } lines[lines.length-1]+=ch; }
  const w=Math.max(...lines.map(l=>c.measureText(l).width))+30, h=lines.length*28+16;
  c.fillStyle="rgba(255,255,255,.96)"; rr(c,x-w/2,y-h,w,h,16); c.fill(); c.beginPath(); c.moveTo(x-9,y-1); c.lineTo(x,y+11); c.lineTo(x+9,y-1); c.fill();
  c.fillStyle="#2a1c24"; c.textAlign="center"; c.textBaseline="middle"; lines.forEach((l,i)=>c.fillText(l,x,y-h+8+14+i*28)); c.restore(); }

  me(dt){ const d=Math.hypot(Room.me.x-800,(Room.me.y-715)*1.8); if(Room.me.m!=null&&Room.me.m>=0&&Room.me.m<1.15&&d<260){ const before=Room.me.m; Room.me.m+=dt*.06*this.level;

  g.setTransform(SC*DPR,0,0,SC*DPR,-camX*SC*DPR,0);
  S.draw(g,t,dt);
  const list=[...Room.peers.values()].map(p=>({...p,isMe:false})); list.push({...Room.me,n:ME.n,c:ME.c,isMe:true});
  list.sort((a,b)=>a.y-b.y); for(const p of list) drawAvatar(g,p,t,p.isMe);
  S.front&&S.front(g,t);
}
let lastT=performance.now(), fpsN=0, fpsT=0;
function loop(t){ const dt=Math.min(.05,(t-lastT)/1000); lastT=t;
  if(Room.id){ step(dt,t); render(t,dt); if(!G.lowChecked){ fpsN++; fpsT+=dt; if(fpsT>4){ G.lowChecked=true; if(fpsN/fpsT<30){ G.low=true; DPR=1; resize(); } } } }
  else idle(t,dt);
  requestAnimationFrame(loop); }
function idle(t,dt){ g.setTransform(1,0,0,1,0,0); const gr=g.createLinearGradient(0,0,0,cv.height); gr.addColorStop(0,"#1b1530"); gr.addColorStop(1,"#3a2234"); g.fillStyle=gr; g.fillRect(0,0,cv.width,cv.height);
  for(let i=0;i<60;i++){ const x=(i*173%cv.width), y=(i*97%cv.height), a=.2+.3*Math.sin(t/900+i); g.fillStyle=`rgba(255,220,180,${a})`; g.beginPath(); g.arc(x,y,1.6*DPR,0,7); g.fill(); } }
requestAnimationFrame(loop);

/* 입력 */
function toWorld(ev){ const r=cv.getBoundingClientRect(); return {x:(ev.clientX-r.left)/SC+camX,y:(ev.clientY-r.top)/SC}; }
let drawing=false;
cv.addEventListener("pointerdown",ev=>{ if(!Room.id) return; audio(); const w=toWorld(ev);
  if(Room.id==="rain"&&Rain.inWin(w.x,w.y)){ drawing=true; Rain.wipe([[w.x,w.y]]); Room.drawPts.push([Math.round(w.x),Math.round(w.y)]); Room.lastPt=w; cv.setPointerCapture(ev.pointerId); return; }
  if(Room.id==="sea"&&Sea.tap(w.x,w.y)) return;
  Room.me.tx=w.x; Room.me.ty=w.y; });
cv.addEventListener("pointermove",ev=>{ if(!drawing) return; const w=toWorld(ev); if(!Rain.inWin(w.x,w.y)) return; const l=Room.lastPt; if(l&&Math.hypot(w.x-l.x,w.y-l.y)<4) return;
  Rain.wipe(l?[[l.x,l.y],[w.x,w.y]]:[[w.x,w.y]]); if(Room.drawPts.length&&l) Room.drawPts.push([Math.round(w.x),Math.round(w.y)]); else Room.drawPts.push([Math.round(l?l.x:w.x),Math.round(l?l.y:w.y)],[Math.round(w.x),Math.round(w.y)]); Room.lastPt=w; });
addEventListener("pointerup",()=>{ if(drawing&&Room.drawPts.length){ pub(tRoom("rain"),{t:"e",k:"draw",p:Room.drawPts.splice(0,40)}); } drawing=false; Room.lastPt=null; });
addEventListener("keydown",e=>{ if(!Room.id||e.target.tagName==="INPUT") return; Room.keys[e.key.length===1?e.key.toLowerCase():e.key]=true; if(e.key.startsWith("Arrow")) e.preventDefault(); });
addEventListener("keyup",e=>{ Room.keys[e.key.length===1?e.key.toLowerCase():e.key]=false; });
addEventListener("blur",()=>{ Room.keys={}; });

/* 채팅 */
function sendChat(m){ m=clean(m); if(!m||!Room.id) return false; const now=performance.now();
  if(now-(Room.lastChat||0)<2000){ $("chatmini").textContent="잠깐! 2초 뒤에 다시 보낼 수 있어요"; return false; }
  Room.lastChat=now; Room.say(m); sendState(false); $("chatmini").textContent="";
  const sb=$("chatSend"); sb.disabled=true; setTimeout(()=>sb.disabled=false,2000); return true; }
$("chatForm").onsubmit=e=>{ e.preventDefault(); if(sendChat($("chatIn").value)) $("chatIn").value=""; $("chatIn").blur(); };

/* ================= 로비 · 접속자 ================= */
const pres=new Map();
function presence(){ if(!ME.key) return; pub(tPres(),{t:"p",n:ME.n,r:Room.id||""}); }
setInterval(presence,3000);
function onPresence(d){ if(d.t!=="p") return; pres.set(d.id,{r:String(d.r||""),at:performance.now()}); if(!$("lobby").hidden) counts(); }
function counts(){ const now=performance.now(), c={fire:0,sea:0,rain:0}; for(const [id,p] of pres){ if(now-p.at>8000){ pres.delete(id); continue; } if(c[p.r]!=null) c[p.r]++; }
  for(const r in c){ const el=document.querySelector(`.room[data-r="${r}"] .cnt`); if(el) el.textContent=c[r]?`👥 ${c[r]}명`:"아직 아무도 없어요"; } }
setInterval(()=>{ if(!$("lobby").hidden) counts(); },2000);
function previewArt(r,cnv){ const w=cnv.width=400, h=cnv.height=500, c=cnv.getContext("2d"); const S=SCENES[r]; if(!S.bg) S.build();
  c.drawImage(S.bg,840,0,720,900,0,0,w,h); c.textAlign="center"; c.textBaseline="middle";
  if(r==="fire"){ const gl=c.createRadialGradient(w*.5,h*.72,4,w*.5,h*.72,180); gl.addColorStop(0,"rgba(255,180,80,.9)"); gl.addColorStop(.3,"rgba(255,110,40,.4)"); gl.addColorStop(1,"rgba(255,80,30,0)"); c.globalCompositeOperation="lighter"; c.fillStyle=gl; c.fillRect(0,0,w,h); c.globalCompositeOperation="source-over";
    c.font="90px serif"; c.textAlign="center"; c.fillText("🔥",w*.5,h*.76); }
  if(r==="sea"){ c.font="54px serif"; c.fillText("🐠",w*.25,h*.33); c.fillText("🐟",w*.62,h*.45); c.fillText("🐢",w*.4,h*.6); }
  if(r==="rain"){ c.strokeStyle="rgba(200,220,255,.5)"; for(let i=0;i<80;i++){ const x=Math.random()*w, y=Math.random()*h*.6; c.beginPath(); c.moveTo(x,y); c.lineTo(x-3,y+16); c.stroke(); } c.font="54px serif"; c.fillText("🐱",w*.6,h*.6); } }
function showLobby(){ $("intro").hidden=true; $("lobby").hidden=false; net.handler=onRoomMsg; sub(tPres()); presence();
  $("lobCls").textContent=`${ME.cls} · ${ME.n}`; const box=$("rooms");
  if(!box.children.length){ for(const r of Object.keys(ROOMS)){ const b=document.createElement("button"); b.className="room"; b.dataset.r=r;
      const cn=document.createElement("canvas"); b.append(cn); const lab=document.createElement("div"); lab.className="lab"; const bb=document.createElement("b"); bb.textContent=ROOMS[r].name; const sm=document.createElement("small"); sm.textContent=ROOMS[r].sub; lab.append(bb,sm);
      const cnt=document.createElement("span"); cnt.className="cnt"; cnt.textContent="…"; b.append(lab,cnt); b.onclick=()=>{ audio(); enterRoom(r); }; box.append(b); setTimeout(()=>previewArt(r,cn),30); } }
  counts(); }

/* ================= 시작 화면 ================= */
(function initIntro(){
  const sws=$("sws"); COLORS.forEach((c,i)=>{ const b=document.createElement("button"); b.type="button"; b.className="sw"; b.style.background=c; b.setAttribute("aria-label",`색 ${i+1}`); b.setAttribute("aria-pressed",String(c===ME.c));
    b.onclick=()=>{ ME.c=c; [...sws.children].forEach(x=>x.setAttribute("aria-pressed",String(x===b))); }; sws.append(b); });
  const qc=new URLSearchParams(location.search).get("c"); $("cls").value=qc||ME.cls; $("nick").value=ME.n;
  ($("cls").value?$("nick"):$("cls")).focus({preventScroll:true});
  $("introForm").onsubmit=e=>{ e.preventDefault(); const cls=$("cls").value.trim().slice(0,16), n=clean($("nick").value,8);
    if(cls.length<2){ $("introErr").textContent="반 코드를 2글자 이상 넣어 주세요."; return; } if(!n){ $("introErr").textContent="별명을 넣어 주세요."; return; }
    if(ME.key) unsub(tPres());
    ME.cls=cls; ME.n=n; ME.key=h32("lounge:"+cls.toLowerCase().replace(/\s+/g,""));
    try{ localStorage.setItem("lounge-me",JSON.stringify({n:ME.n,c:ME.c,cls:ME.cls})); }catch(e){}
    audio(); netStart(); showLobby(); };
})();
$("reBtn").onclick=()=>{ unsub(tPres()); $("lobby").hidden=true; $("intro").hidden=false; };
$("backBtn").onclick=leaveRoom;
$("sndBtn").onclick=()=>{ audio(); setSound(!snd.on); }; setSound(snd.on);
$("qrBtn").onclick=()=>{ const url=location.origin+location.pathname+"?c="+encodeURIComponent(ME.cls); $("qrUrl").textContent=url; $("qrCode").textContent="반 코드: "+ME.cls;
  const q=$("qr"); q.innerHTML=""; try{ const qq=qrcode(0,"M"); qq.addData(url,"Byte"); qq.make(); q.innerHTML=qq.createSvgTag({cellSize:6,margin:2,scalable:true}); }catch(e){ const im=new Image(); im.alt="QR"; im.style.width="100%"; im.src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data="+encodeURIComponent(url); q.append(im); }
  $("qrbox").hidden=false; };
$("qrClose").onclick=()=>$("qrbox").hidden=true;
addEventListener("pagehide",()=>{ if(Room.id) pub(tRoom(Room.id),{t:"bye"}); });
</script>
