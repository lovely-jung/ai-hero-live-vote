<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALGO 보스전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{--bg:#F5F3FA;--card:#FFFFFF;--ink:#1F1A2E;--sub:#6B6585;--line:#E6E1F2;--soft:#F1ECFD;--p:#6C2BD9;--p2:#8B5CF6;--o:#FF6B1A;--t:#14B8A6;--pk:#E0457B;--g:#16A34A;--r:#E11D48;--y:#FFD43B;
--font:"Noto Sans KR","Malgun Gothic",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;overflow-x:hidden}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--p2);outline-offset:2px}
h1,h2,h3,p{margin:0}
.btn{background:var(--p);color:#fff;border-radius:12px;padding:12px 24px;font-weight:700;font-size:18px;transition:transform .08s,background .2s}
.btn:hover{background:#5a20c0}.btn:active{transform:scale(.98)}
.btn:disabled{background:#c9c1e3;cursor:not-allowed}
.btn.light{background:var(--soft);color:var(--p)}
.btn.big{font-size:22px;padding:16px 34px;border-radius:14px}
.btn.o{background:var(--o)}.btn.o:hover{background:#e55a0e}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 2px 10px rgba(40,20,90,.05)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;background:var(--soft);color:var(--p)}
.muted{color:var(--sub)}
/* landing */
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:54px;height:54px;border-radius:16px;background:var(--ink);display:grid;place-items:center;color:#fff;font-size:28px}
.brand h1{font-size:clamp(28px,5vw,42px);font-weight:900;letter-spacing:-.02em}
.formcard{width:min(460px,100%);padding:26px;display:flex;flex-direction:column;gap:12px}
.formcard input{font:inherit;font-size:24px;text-align:center;border:2px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--ink)}
.formcard input:focus{border-color:var(--p2);outline:none}
.avs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.av{aspect-ratio:1;font-size:26px;border-radius:10px;border:2px solid var(--line);background:#fff}
.av.on{border-color:var(--p);background:var(--soft)}
/* host */
#host{min-height:100vh;display:flex;flex-direction:column}
.hbar{display:flex;align-items:center;gap:14px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line)}
.hbar .title{font-weight:900;font-size:20px}
.code{font-weight:900;font-size:22px;letter-spacing:.12em;background:var(--ink);color:#fff;border-radius:10px;padding:4px 14px}
.sp{flex:1}
.timer{font-weight:900;font-size:28px;color:var(--p);min-width:90px;text-align:right;font-variant-numeric:tabular-nums}
.timer.low{color:var(--r)}
.lobby{display:grid;grid-template-columns:360px 1fr;gap:20px;padding:20px 24px}
.qrc{padding:20px;text-align:center;display:flex;flex-direction:column;gap:10px}
.qrc svg{width:100%;height:auto}
.qrc .bigc{font-size:56px;font-weight:900;letter-spacing:.12em}
.qrc .u{font-size:13px;color:var(--sub);word-break:break-all}
.crowd{display:flex;flex-wrap:wrap;gap:10px}
.kid{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 6px;font-weight:700;animation:pop .35s}
.kid .e{font-size:26px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rules div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;font-size:16px;line-height:1.45}
.rules b{display:block;font-size:34px;margin-bottom:6px}
.rules strong{font-size:19px}
.seg{display:flex;gap:6px;align-items:center}
.seg button{padding:8px 14px;border-radius:10px;background:var(--soft);color:var(--p);font-weight:700}
.seg button.on{background:var(--p);color:#fff}
.battle{flex:1;display:grid;grid-template-columns:1fr 330px;gap:18px;padding:18px 24px}
.stage{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:22px 24px 26px;gap:16px}
.hpwrap{width:100%;display:flex;flex-direction:column;gap:8px}
.hpline{display:flex;align-items:center;gap:12px;font-weight:900}
.hpline .nm{font-size:22px}.hpline .pc{margin-left:auto;font-size:22px;color:var(--r);font-variant-numeric:tabular-nums}
.hp{position:relative;height:30px;border-radius:999px;background:#F3EFF9;overflow:hidden;border:1px solid var(--line)}
.hp .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#FF6B1A,#E11D48);transition:width .35s ease-out}
.hp .ghost{position:absolute;inset:0 auto 0 0;background:#FECACA;transition:width 1.2s ease-out .3s}
.hp .tick{position:absolute;top:0;bottom:0;width:2px;background:#fff}
.letters{display:flex;gap:8px;justify-content:center}
.letters i{font-style:normal;width:46px;height:52px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;font-weight:900;font-size:26px;color:#cfc8e6;background:#fff;transition:all .3s}
.letters i.on{border:2px solid var(--g);color:var(--g);background:#ecfdf3;transform:scale(1.08)}
.boss{position:relative;width:min(380px,60%);aspect-ratio:1;display:grid;place-items:center;margin-top:4px}
.boss svg{width:100%;height:100%;filter:drop-shadow(0 18px 24px rgba(60,20,120,.18));animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.boss.hit svg{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px) rotate(-2deg)}75%{transform:translateX(10px) rotate(2deg)}}
.boss.dead svg{animation:none;transform:rotate(-12deg) translateY(30px);opacity:.35;transition:all 1s}
.dmg{position:absolute;font-weight:900;font-size:26px;color:var(--r);pointer-events:none;animation:up 1.1s ease-out forwards;white-space:nowrap;text-shadow:0 2px 0 #fff}
.dmg.crit{font-size:38px;color:var(--o)}
.dmg span{font-size:24px}
@keyframes up{0%{opacity:0;transform:translateY(10px) scale(.6)}15%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-90px) scale(1)}}
.phasebanner{font-weight:700;color:var(--sub)}
.phasebanner b{color:var(--p)}
.side{display:flex;flex-direction:column;gap:14px}
.rank{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.rank h3{font-size:16px;margin-bottom:6px}
.rrow{display:grid;grid-template-columns:22px 28px 1fr auto;gap:8px;align-items:center;font-size:15px;padding:5px 0;border-bottom:1px solid #f3f0fa}
.rrow b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .v{font-weight:900;color:var(--r);font-variant-numeric:tabular-nums}
.feed{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-height:200px}
.feed h3{font-size:16px;margin-bottom:4px}
.feed div{font-size:14px;animation:pop .25s}
.ctrl{padding:16px;display:flex;flex-direction:column;gap:10px}
.ov{position:fixed;inset:0;background:rgba(20,10,40,.55);display:grid;place-items:center;z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.endcard{width:min(860px,94vw);padding:34px;text-align:center;display:flex;flex-direction:column;gap:12px;animation:pop .35s}
.endcard .ic{font-size:72px}
.endcard h2{font-size:36px;font-weight:900}
.endcard .who{font-size:18px;color:var(--sub);line-height:1.5}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin:10px 0}
.pd{width:180px;border-radius:16px 16px 0 0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px}
.pd .e{font-size:54px}.pd b{font-size:18px}.pd .rk{font-size:36px;font-weight:900}.pd small{font-size:14px;color:var(--sub);font-weight:700}
.flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,rgba(255,212,59,.0),rgba(255,107,26,.25));animation:fl .5s forwards;z-index:15}
@keyframes fl{from{opacity:1}to{opacity:0}}
/* student */
#student{min-height:100vh;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.sbar{display:flex;align-items:center;gap:10px;padding:12px 16px}
.sbar .me{font-size:30px}.sbar .nm{font-weight:900;font-size:18px;flex:1}
.mini{padding:0 16px;display:flex;flex-direction:column;gap:6px}
.mini .hp{height:16px}
.mini .row{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--sub)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 16px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.stat span{display:block;font-size:12px;color:var(--sub)}
.stat b{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.stat.combo b{color:var(--o)}
.sbody{flex:1;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}
.qtag{align-self:flex-start}
.qcard{padding:20px;font-size:21px;font-weight:700;line-height:1.45}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:15px 16px;font-size:18px;font-weight:500;display:flex;gap:12px;align-items:center;transition:transform .08s}
.opt:hover{border-color:var(--p2)}.opt:active{transform:scale(.99)}
.opt .k{width:30px;height:30px;border-radius:8px;background:var(--soft);color:var(--p);display:grid;place-items:center;font-weight:900;flex:none}
.opt.pick{border-color:var(--p);background:var(--soft)}
.opt.wrong{border-color:var(--r);background:#fff1f2}
.opt[disabled]{cursor:default}
.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px 10px}
.res .e{font-size:88px;animation:pop .3s}
.res h2{font-size:30px;font-weight:900}
.res .big{font-size:46px;font-weight:900;color:var(--r)}
.res .big.crit{color:var(--o)}
.res .ans{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700}
.stun{font-size:64px;font-weight:900;color:var(--sub)}
.net{font-size:12px;color:var(--sub);text-align:center;padding:8px}
@media (max-width:1000px){.battle{grid-template-columns:1fr}.lobby{grid-template-columns:1fr}.rules{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="landing" class="center">
  <div class="brand"><div class="logo">👾</div><h1>ALGO 보스전</h1></div>
  <p class="muted">다 같이 문제를 맞혀 연구소를 잠근 ALGO를 쓰러뜨려요</p>
  <div class="card formcard">
    <input id="codeIn" inputmode="numeric" maxlength="5" placeholder="방 코드 5자리" autocomplete="off">
    <button class="btn big" id="toJoin">입장하기</button>
  </div>
  <button class="btn light" id="toHost">선생님: 우리 반 방 만들기</button>
</div>

<div id="prof" class="center hidden">
  <div class="brand"><div class="logo">👾</div><h1>내 히어로 고르기</h1></div>
  <div class="card formcard">
    <div class="avs" id="avs"></div>
    <input id="nameIn" maxlength="8" placeholder="별명 (실명 X)" autocomplete="off">
    <button class="btn big" id="joinGo">전투 참가</button>
    <p class="muted" id="pmsg" style="font-size:14px"></p>
  </div>
</div>

<div id="host" class="hidden">
  <div class="hbar"><span class="title">👾 ALGO 보스전</span><span class="code" id="hCode">-----</span><span class="muted" id="hInfo"></span><span class="sp"></span><span class="timer" id="hTimer"></span></div>
  <div id="hBody"></div>
</div>

<div id="student" class="hidden">
  <div class="sbar"><span class="me" id="sAv"></span><span class="nm" id="sNm"></span><span class="chip" id="sRank">-</span></div>
  <div class="mini"><div class="row"><span>👾 ALGO</span><span id="sHpTxt">100%</span></div><div class="hp"><div class="fill" id="sHp" style="width:100%"></div></div></div>
  <div class="stats">
    <div class="stat"><span>내 공격력</span><b id="sDmg">0</b></div>
    <div class="stat combo"><span>연속 정답</span><b id="sCombo">0</b></div>
    <div class="stat"><span>남은 시간</span><b id="sTime">-</b></div>
  </div>
  <div class="sbody" id="sBody"></div>
  <div class="net" id="sNet">연결 중…</div>
</div>
<div id="ov"></div>

<script>
"use strict";
/* ===== 문제 (인공지능 히어로 1~6교시) — HP 20%씩 깎일 때마다 다음 교시로 ===== */
const ZONES=[
 {name:"1교시 · AI의 정체",L:"H",pool:[
  {q:"다음 중 AI가 아닌 것은?",o:["넷플릭스 영화 추천","유튜브 자동 자막","계산기의 3×7=21","얼굴 인식 잠금"],a:2},
  {q:"챗GPT와 알파고는 어떤 AI일까요?",o:["강한 AI","약한 AI (한 분야를 잘하는 AI)","초지능 AI","AI가 아니다"],a:1},
  {q:"AI의 실력을 결정하는 가장 중요한 것은?",o:["화면 크기","데이터","프로그램 이름","전기 요금"],a:1},
  {q:"AI가 사실이 아닌 내용을 그럴듯하게 지어내는 것은?",o:["할루시네이션(환각)","업데이트","로그인","다운로드"],a:0},
  {q:"'컴퓨터'는 원래 무엇을 부르는 말이었을까요?",o:["계산하는 사람","전자 기계","게임기","전화기"],a:0},
  {q:"AI는 모르는 질문에 항상 '모른다'고 답한다.",o:["맞다 (O)","아니다 (X)"],a:1},
  {q:"AI가 만든 사진인지 알아볼 때 좋은 방법은?",o:["좋아요 수 보기","출처와 원본 확인하기","그냥 믿기","화질만 보기"],a:1}]},
 {name:"2교시 · 닮은꼴 AI",L:"U",pool:[
  {q:"컴퓨터에게 사진은 무엇으로 보일까요?",o:["숫자 바둑판(픽셀)","사람 눈과 같은 그림","글자 설명","소리"],a:0},
  {q:"티처블 머신으로 AI를 만드는 순서로 알맞은 것은?",o:["테스트 → 학습 → 사진 모으기","사진 모으기 → 학습 → 테스트","학습 → 사진 모으기 → 테스트","테스트 → 사진 모으기 → 학습"],a:1},
  {q:"얼굴 사진 수십억 장을 허락 없이 모아 벌금을 낸 회사. 가장 큰 문제는?",o:["사진 화질","주인의 동의 없이 모았다","AI 이름","컴퓨터 속도"],a:1},
  {q:"얼굴 인식 AI가 어떤 사람들의 얼굴을 더 자주 틀리는 이유는?",o:["사진을 싫어해서","학습 데이터에 그런 얼굴이 적어서","카메라 고장","일부러 틀려서"],a:1},
  {q:"친구 얼굴을 허락 없이 AI로 합성해 단톡방에 올려도 장난이면 괜찮다.",o:["맞다 (O)","아니다 (X)"],a:1},
  {q:"AI에게 사진을 더 많이, 더 다양하게 보여 주면?",o:["더 정확해진다","더 느려지기만 한다","아무 변화 없다","고장 난다"],a:0}]},
 {name:"3교시 · 미래 직업",L:"M",pool:[
  {q:"ATM이 생긴 뒤 은행원은 어떻게 됐을까요?",o:["모두 사라졌다","돈 세는 일↓ 상담 같은 일↑","ATM만 고친다","전혀 안 바뀌었다"],a:1},
  {q:"3교시 새 직업 발명 공식은?",o:["문제 + AI 기술 + 사람의 강점","돈 + 유행 + 운","AI + AI + AI","연예인 + 게임"],a:0},
  {q:"캔바 동영상에서 AI로 장면 이미지를 만드는 앱은?",o:["Magic Media","계산기","메모장","휴지통"],a:0},
  {q:"대부분의 직업은 AI 때문에 완전히 사라진다.",o:["맞다 (O)","아니다 (X)"],a:1},
  {q:"AI 이미지 프롬프트로 가장 좋은 것은?",o:["멋지게","의사","병원에서 AI 로봇과 환자를 돌보는 간호사, 3D 일러스트","아무거나"],a:2},
  {q:"AI와 함께 일할 때 사람이 더 잘하는 것은?",o:["엄청 빠른 계산","공감하고 배려하기","데이터 수억 개 외우기","밤새 쉬지 않기"],a:1}]},
 {name:"4교시 · 서비스 기획",L:"A",pool:[
  {q:"디자인씽킹의 첫 단계는?",o:["프로토타입","공감","테스트","아이디어"],a:1},
  {q:"AI 서비스 탄생 공식은?",o:["관심 영역 + 불편함 + How? + 데이터","돈 + 광고","코딩 + 코딩","유행 + 운"],a:0},
  {q:"번역 앱이 주로 쓰는 AI 능력은?",o:["시각","청각","언어","예측"],a:2},
  {q:"급식 잔반을 줄이는 AI에게 알맞은 데이터는?",o:["학생 집 주소","남긴 양 사진·날씨·메뉴","전교생 성적표","인기 동영상"],a:1},
  {q:"좋은 '문제 문장'은?",o:["환경 문제가 심각하다","세상을 바꾸고 싶다","우리 반은 분리수거할 때 몰라서 일반쓰레기에 버린다","쓰레기가 많다"],a:2},
  {q:"디자인씽킹 '공감' 단계에서 하는 일은?",o:["사용자의 불편함을 듣고 관찰하기","바로 코딩하기","광고 만들기","가격 정하기"],a:0}]},
 {name:"5~6교시 · 앱과 미래",L:"N",pool:[
  {q:"ALGO가 만든 분리수거 앱의 버그는? 🧴 투명 페트병 → ?",o:["투명 페트병 따로 배출","음식물쓰레기","종이류","캔류"],a:1},

}
function updStats(){const d=S.st;if(!d)return;const pc=d.max?d.hp/d.max*100:100;$('sHp').style.width=pc+'%';$('sHpTxt').textContent=Math.ceil(pc)+'%';
 if(d.me){$('sDmg').textContent=d.me.dmg;$('sCombo').textContent=d.me.combo+(d.me.combo>=3?'🔥':'');$('sRank').textContent=d.me.n?`공격 ${d.me.rank}위 / ${d.me.n}명`:'-'}}
setInterval(()=>{if(S.st&&S.st.phase==='battle')$('sTime').textContent=mmss(S.deadline-Date.now());else $('sTime').textContent='-'},500);
function renderS(){
 const d=S.st,b=$('sBody');
 if(!d||d.phase==='lobby'){b.innerHTML=`<div class="res"><div class="e">${esc(S.av)}</div><h2>입장 완료!</h2><p class="muted">선생님 화면에 내 히어로가 보이나요?<br>전투 시작을 기다려요</p><p class="muted" style="font-size:15px">⚔️ 맞히면 공격 · 🔥 연속이면 크리티컬 · 💫 틀리면 3초 기절</p></div>`;return}
 if(d.phase==='end'){const me=d.me||{};b.innerHTML=`<div class="res"><div class="e">${d.win?'🎉':'💨'}</div><h2>${d.win?'ALGO 격파!':'ALGO가 도망쳤어요'}</h2><p class="big">${me.dmg||0}</p><p class="muted">내 공격력 · 공격 ${me.rank||'-'}위 · 최고 ${me.best||0}연속</p><p class="ans">출구 암호: HUMAN</p></div>`;return}
 if(S.res){const r=S.res;
  if(r.ok){b.innerHTML=`<div class="res"><div class="e">${r.crit>2?'💥':r.crit>1?'🔥':'⚔️'}</div><h2>${r.crit>2?'3배 크리티컬!':r.crit>1?'크리티컬!':'정답! 공격 성공'}</h2><p class="big ${r.crit>1?'crit':''}">-${r.dmg}</p></div>`}
  else{const q=S.q;b.innerHTML=`<div class="res"><div class="e">💫</div><h2>ALGO의 반격! 기절</h2><p class="stun" id="sStun">3</p>${q?`<p class="ans">정답: ${esc(q.o[r.correct])}</p>`:''}</div>`}
  return}
 if(!S.q){b.innerHTML='<div class="res"><div class="e">⏳</div><h2>문제 불러오는 중…</h2></div>';return}
 const q=S.q;
 b.innerHTML=`<span class="chip qtag">${esc(q.zone)}</span><div class="card qcard">${esc(q.q)}</div><div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
 b.querySelectorAll('.opt').forEach(x=>x.onclick=()=>{if(S.lock)return;S.lock=true;x.classList.add('pick');b.querySelectorAll('.opt').forEach(y=>y.disabled=true);sendS({t:'ans',id:q.id,c:+x.dataset.i})});
}

/* ================= 시작 ================= */
$('toHost').onclick=hostStart;
$('toJoin').onclick=()=>{const c=$('codeIn').value.replace(/\D/g,'');if(c.length!==5){$('codeIn').focus();return}studentProfile(c)};
$('codeIn').onkeydown=e=>{if(e.key==='Enter')$('toJoin').click()};
if(params.has('host'))hostStart();else if(params.get('r'))studentProfile(params.get('r').replace(/\D/g,'').slice(0,5));
</script>
