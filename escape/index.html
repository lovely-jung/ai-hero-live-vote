<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 연구소 탈출 작전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{--bg:#F5F3FA;--card:#FFFFFF;--ink:#1F1A2E;--sub:#6B6585;--line:#E6E1F2;--soft:#F1ECFD;--p:#6C2BD9;--p2:#8B5CF6;--o:#FF6B1A;--t:#14B8A6;--pk:#E0457B;--b:#2563EB;--g:#16A34A;--r:#DC2626;--y:#FFE45C;
--font:"Noto Sans KR","Malgun Gothic",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--p2);outline-offset:2px}
h1,h2,h3,p{margin:0}
.btn{background:var(--p);color:#fff;border-radius:12px;padding:12px 24px;font-weight:700;font-size:18px;transition:transform .08s,background .2s}
.btn:hover{background:#5a20c0}.btn:active{transform:scale(.98)}
.btn:disabled{background:#c9c1e3;cursor:not-allowed}
.btn.light{background:var(--soft);color:var(--p)}
.btn.big{font-size:22px;padding:16px 34px;border-radius:14px}
.btn.o{background:var(--o)}.btn.o:hover{background:#e55a0e}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 2px 10px rgba(40,20,90,.05)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;background:var(--soft);color:var(--p)}
.muted{color:var(--sub)}
/* ===== landing / profile ===== */
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:54px;height:54px;border-radius:16px;background:var(--p);display:grid;place-items:center;color:#fff;font-size:28px}
.brand h1{font-size:clamp(28px,5vw,42px);font-weight:900;letter-spacing:-.02em}
.formcard{width:min(460px,100%);padding:26px;display:flex;flex-direction:column;gap:12px}
.formcard input{font:inherit;font-size:24px;text-align:center;border:2px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--ink)}
.formcard input:focus{border-color:var(--p2);outline:none}
.avs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.av{aspect-ratio:1;font-size:26px;border-radius:10px;border:2px solid var(--line);background:#fff}
.av.on{border-color:var(--p);background:var(--soft)}
/* ===== host ===== */
#host{min-height:100vh;display:flex;flex-direction:column}
.hbar{display:flex;align-items:center;gap:14px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line)}
.hbar .title{font-weight:900;font-size:20px}
.code{font-weight:900;font-size:22px;letter-spacing:.12em;background:var(--ink);color:#fff;border-radius:10px;padding:4px 14px}
.sp{flex:1}
.phase{display:flex;align-items:center;gap:10px;font-weight:700}
.timer{min-width:64px;text-align:center;font-weight:900;font-size:26px;color:var(--p)}
.timer.low{color:var(--r)}
.hmain{flex:1;display:grid;grid-template-columns:1fr 320px;gap:18px;padding:18px 24px}
.alert{display:flex;align-items:center;gap:12px;padding:12px 18px}
.alert .bot{width:44px;height:38px;border-radius:10px;border:3px solid var(--r);display:grid;place-items:center;flex:none}
.alert .bot i{width:16px;height:16px;border-radius:50%;background:var(--r);box-shadow:0 0 10px var(--r);animation:blink 3s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.meter{flex:1;height:12px;border-radius:999px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--r));transition:width .6s}
.map{display:grid;grid-template-columns:repeat(5,1fr) 150px;gap:12px;margin-top:14px}
.room{padding:14px;display:flex;flex-direction:column;gap:10px;min-height:max(340px,calc(100vh - 240px))}
.room .rh{display:flex;align-items:center;gap:8px}
.room .no{width:30px;height:30px;border-radius:9px;background:var(--soft);color:var(--p);display:grid;place-items:center;font-weight:900}
.room .nm{font-weight:700;font-size:15px;line-height:1.25}
.room .cl{font-size:12px;color:var(--sub)}
.lt{margin-left:auto;width:30px;height:34px;border-radius:8px;border:2px dashed var(--line);display:grid;place-items:center;font-weight:900;color:#c9c1e3}
.lt.on{border:2px solid var(--g);color:var(--g);background:#ecfdf3}
.lanes{flex:1;display:flex;flex-direction:column;gap:6px}
.lane{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;border-radius:10px;background:#FAF9FD;padding:6px 6px 6px;padding-top:20px;position:relative;min-height:46px;flex:1 0 auto}
.lane::before{content:attr(data-s);position:absolute;right:6px;top:4px;font-size:11px;color:#b9b2d4;font-weight:700}
.lane.door{background:#FFF4EC;border:1px dashed #ffc7a3}
.lane.door::before{content:"🚪 문 앞";color:var(--o)}
.bot2{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 8px 2px 3px;font-size:12px;font-weight:700;max-width:120px;transition:transform .3s}
.bot2 .e{font-size:18px}.bot2 .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bot2.moved{animation:hop .6s}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-8px)}100%{transform:translateY(0)}}
.exitcol{background:linear-gradient(180deg,#ecfdf3,#fff);border-color:#bbf7d0}
.exitcol .lanes .lane{background:transparent}
.side{display:flex;flex-direction:column;gap:14px}
.rank{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.rank h3{font-size:16px;margin-bottom:4px}
.rrow{display:grid;grid-template-columns:22px 26px 1fr auto;gap:8px;align-items:center;font-size:14px;padding:4px 0;border-bottom:1px solid #f3f0fa}
.rrow b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .pg{font-size:12px;color:var(--sub)}
.ctrl{padding:16px;display:flex;flex-direction:column;gap:10px}
.ctrl .pt{font-weight:900;font-size:18px}
.lobby{display:grid;grid-template-columns:360px 1fr;gap:20px;padding:20px 24px}
.qrc{padding:20px;text-align:center;display:flex;flex-direction:column;gap:10px}
.qrc svg{width:100%;height:auto}
.qrc .big{font-size:56px;font-weight:900;letter-spacing:.12em}
.qrc .u{font-size:13px;color:var(--sub);word-break:break-all}
.crowd{display:flex;flex-wrap:wrap;gap:10px}
.kid{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 6px;font-weight:700;animation:pop .35s}
.kid .e{font-size:26px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.howto{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.howto div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:14px;line-height:1.45}
.howto b{display:block;font-size:22px;margin-bottom:4px}
/* event overlay */
.ov{position:fixed;inset:0;background:rgba(20,10,40,.55);display:grid;place-items:center;z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.evcard{width:min(640px,92vw);padding:34px;text-align:center;display:flex;flex-direction:column;gap:12px;animation:pop .35s}
.evcard .ic{font-size:80px}
.evcard h2{font-size:34px;font-weight:900}
.evcard .who{font-size:18px;color:var(--sub);line-height:1.5}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin:10px 0}
.pd{width:180px;border-radius:16px 16px 0 0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px;color:var(--ink)}
.pd .e{font-size:56px}.pd b{font-size:18px}.pd .rk{font-size:40px;font-weight:900}
/* ===== student ===== */
#student{min-height:100vh;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.sbar{display:flex;align-items:center;gap:10px;padding:12px 16px}
.sbar .me{font-size:30px}.sbar .nm{font-weight:900;font-size:18px;flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px}
.stat.wide{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.stat span{display:block;font-size:12px;color:var(--sub)}
.stat b{font-size:20px;font-weight:900}
.letters{display:flex;gap:4px}
.letters i{font-style:normal;width:30px;height:32px;border-radius:6px;border:2px dashed var(--line);display:grid;place-items:center;font-weight:900;font-size:14px;color:#c9c1e3}
.letters i.on{border:2px solid var(--g);color:var(--g);background:#ecfdf3}
.sbody{flex:1;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}
.ptitle{display:flex;align-items:center;justify-content:space-between}
.ptitle{gap:10px}.ptitle h2{font-size:21px;font-weight:900;line-height:1.3}.ptitle .chip{flex:none}
.energy{display:flex;gap:4px;flex-wrap:wrap}
.energy i{width:22px;height:30px;border-radius:6px;background:var(--y);border:1px solid #e9c93a}
.energy i.off{background:#eee;border-color:#ddd}
.alloc{display:flex;flex-direction:column;gap:10px}
.arow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px}
.arow .ic{font-size:30px;text-align:center}
.arow b{font-size:17px}.arow p{font-size:13px;color:var(--sub);margin-top:2px;line-height:1.4}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:10px;background:var(--soft);color:var(--p);font-size:22px;font-weight:900}
.step button:disabled{opacity:.35}
.step span{min-width:30px;text-align:center;font-size:22px;font-weight:900}
.qcard{padding:18px;font-size:20px;font-weight:700;line-height:1.45}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-size:18px;font-weight:500;display:flex;gap:12px;align-items:center}
.opt:hover{border-color:var(--p2)}
.opt .k{width:30px;height:30px;border-radius:8px;background:var(--soft);color:var(--p);display:grid;place-items:center;font-weight:900;flex:none}
.opt.gone{opacity:.3;text-decoration:line-through;pointer-events:none}
.opt.pick{border-color:var(--p);background:var(--soft)}
.wait{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:30px 10px}
.wait .e{font-size:84px}
.wait h2{font-size:26px;font-weight:900}
.log{display:flex;flex-direction:column;gap:8px;width:100%}
.log div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:left;font-weight:500}
.log .good{border-color:#bbf7d0;background:#f0fdf4}
.log .bad{border-color:#fecaca;background:#fef2f2}
.net{font-size:12px;color:var(--sub);text-align:center;padding:8px}
@media (max-width:1100px){.hmain{grid-template-columns:1fr}.map{grid-template-columns:repeat(3,1fr)}}
@media (max-width:760px){.lobby{grid-template-columns:1fr}.howto{grid-template-columns:1fr 1fr}.map{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="landing" class="center">
  <div class="brand"><div class="logo">🤖</div><h1>AI 연구소 탈출 작전</h1></div>
  <p class="muted">에너지를 잘 나눠 쓰고, 퀴즈로 문을 열어 연구소를 탈출하세요</p>
  <div class="card formcard">
    <input id="codeIn" inputmode="numeric" maxlength="5" placeholder="방 코드 5자리" autocomplete="off">
    <button class="btn big" id="toJoin">입장하기</button>
  </div>
  <button class="btn light" id="toHost">선생님: 우리 반 방 만들기</button>
</div>

<div id="prof" class="center hidden">
  <div class="brand"><div class="logo">🤖</div><h1>내 탈출 로봇</h1></div>
  <div class="card formcard">
    <div class="avs" id="avs"></div>
    <input id="nameIn" maxlength="8" placeholder="별명 (실명 X)" autocomplete="off">
    <button class="btn big" id="joinGo">작전 참가</button>
    <p class="muted" id="pmsg" style="font-size:14px"></p>
  </div>
</div>

<div id="host" class="hidden">
  <div class="hbar"><span class="title">🤖 AI 연구소 탈출 작전</span><span class="code" id="hCode">-----</span><span class="muted" id="hInfo"></span><span class="sp"></span><span class="phase" id="hPhase"></span><span class="timer" id="hTimer"></span></div>
  <div id="hBody"></div>
</div>

<div id="student" class="hidden">
  <div class="sbar"><span class="me" id="sAv"></span><span class="nm" id="sNm"></span><span class="chip" id="sTurn"></span></div>
  <div class="stats">
    <div class="stat"><span>위치</span><b id="sZone">1구역</b></div>
    <div class="stat"><span>문까지</span><b id="sSteps">0/4</b></div>
    <div class="stat"><span>순위</span><b id="sRank">-</b></div>
    <div class="stat wide"><span>비밀 글자</span><div class="letters" id="sLet"></div></div>
  </div>
  <div class="sbody" id="sBody"></div>
  <div class="net" id="sNet">연결 중…</div>
</div>
<div id="ov"></div>

<script>
"use strict";
/* ===== 구역과 문제 (인공지능 히어로 1~6교시) ===== */
const ZONES=[
 {name:"정체 확인실",cls:"1교시",L:"H",pool:[
  {q:"다음 중 AI가 아닌 것은?",o:["넷플릭스 영화 추천","유튜브 자동 자막","계산기의 3×7=21","얼굴 인식 잠금"],a:2},
  {q:"챗GPT와 알파고는 어떤 AI일까요?",o:["강한 AI","약한 AI (한 분야를 잘하는 AI)","초지능 AI","AI가 아니다"],a:1},
  {q:"AI의 실력을 결정하는 가장 중요한 것은?",o:["화면 크기","데이터","프로그램 이름","전기 요금"],a:1},
  {q:"AI가 사실이 아닌 내용을 그럴듯하게 지어내는 것은?",o:["할루시네이션(환각)","업데이트","로그인","다운로드"],a:0},
  {q:"'컴퓨터'는 원래 무엇을 부르는 말이었을까요?",o:["계산하는 사람","전자 기계","게임기","전화기"],a:0},
  {q:"AI는 모르는 질문에 항상 '모른다'고 답한다.",o:["맞다 (O)","아니다 (X)"],a:1}]},
 {name:"얼굴 학습실",cls:"2교시",L:"U",pool:[
  {q:"컴퓨터에게 사진은 무엇으로 보일까요?",o:["숫자 바둑판(픽셀)","사람 눈과 같은 그림","글자 설명","소리"],a:0},
  {q:"티처블 머신으로 AI를 만드는 순서로 알맞은 것은?",o:["테스트 → 학습 → 사진 모으기","사진 모으기 → 학습 → 테스트","학습 → 사진 모으기 → 테스트","테스트 → 사진 모으기 → 학습"],a:1},
  {q:"얼굴 사진 수십억 장을 허락 없이 모아 벌금을 낸 회사. 가장 큰 문제는?",o:["사진 화질","주인의 동의 없이 모았다","AI 이름","컴퓨터 속도"],a:1},
  {q:"얼굴 인식 AI가 어떤 사람들의 얼굴을 더 자주 틀리는 이유는?",o:["사진을 싫어해서","학습 데이터에 그런 얼굴이 적어서","카메라 고장","일부러 틀려서"],a:1},
  {q:"친구 얼굴을 허락 없이 AI로 합성해 단톡방에 올려도 장난이면 괜찮다.",o:["맞다 (O)","아니다 (X)"],a:1}]},
 {name:"미래 직업실",cls:"3교시",L:"M",pool:[
  {q:"ATM이 생긴 뒤 은행원은 어떻게 됐을까요?",o:["모두 사라졌다","돈 세는 일↓ 상담 같은 일↑","ATM만 고친다","전혀 안 바뀌었다"],a:1},
  {q:"3교시 새 직업 발명 공식은?",o:["문제 + AI 기술 + 사람의 강점","돈 + 유행 + 운","AI + AI + AI","연예인 + 게임"],a:0},
  {q:"캔바 동영상에서 AI로 장면 이미지를 만드는 앱은?",o:["Magic Media","계산기","메모장","휴지통"],a:0},
  {q:"대부분의 직업은 AI 때문에 완전히 사라진다.",o:["맞다 (O)","아니다 (X)"],a:1},
  {q:"AI 이미지 프롬프트로 가장 좋은 것은?",o:["멋지게","의사","병원에서 AI 로봇과 환자를 돌보는 간호사, 3D 일러스트","아무거나"],a:2}]},
 {name:"서비스 기획실",cls:"4교시",L:"A",pool:[
  {q:"디자인씽킹의 첫 단계는?",o:["프로토타입","공감","테스트","아이디어"],a:1},
  {q:"AI 서비스 탄생 공식은?",o:["관심 영역 + 불편함 + How? + 데이터","돈 + 광고","코딩 + 코딩","유행 + 운"],a:0},
  {q:"번역 앱이 주로 쓰는 AI 능력은?",o:["시각","청각","언어","예측"],a:2},
  {q:"급식 잔반을 줄이는 AI에게 알맞은 데이터는?",o:["학생 집 주소","남긴 양 사진·날씨·메뉴","전교생 성적표","인기 동영상"],a:1},
  {q:"좋은 '문제 문장'은?",o:["환경 문제가 심각하다","세상을 바꾸고 싶다","우리 반은 분리수거할 때 몰라서 일반쓰레기에 버린다","쓰레기가 많다"],a:2}]},
 {name:"앱 통제실",cls:"5~6교시",L:"N",pool:[
  {q:"ALGO가 만든 분리수거 앱의 버그는? 🧴 투명 페트병 → ?",o:["투명 페트병 따로 배출","음식물쓰레기","종이류","캔류"],a:1},
  {q:"앱을 고칠 때 가장 좋은 요청은?",o:["더 좋게 해 줘","이상한 거 다 고쳐 줘","'다' 버튼을 '다 쓴 볼펜'으로 바꿔 줘","알아서 해"],a:2},

function newStu(name,av){return {name,av,on:true,zone:0,steps:0,energy:BASE_E,bonus:0,penalty:0,alloc:null,cur:null,quiz:null,ans:null,used:{},letters:[],escaped:false,escTurn:0,correct:0,log:[],moved:false}}

 if(d.t==='join'){const name=String(d.name||'').slice(0,8)||'익명',av=AV.includes(d.av)?d.av:'🙂';
  if(s){s.name=name;s.av=av;s.on=true}else H.stu[d.sid]=newStu(name,av);H.conns[d.sid]=c;if(H.phase==='lobby')tone(600+Math.random()*400,.08);renderH();send(d.sid);return}
 if(!s)return;
 if(d.t==='alloc'&&H.phase==='plan'&&!s.alloc&&!s.escaped){const a={},tot=s.energy;let sum=0;for(const x of ACTS){a[x.k]=Math.max(0,Math.min(tot,Math.floor(+d.a[x.k]||0)));sum+=a[x.k]}if(sum>tot)return;a.move+=tot-sum;s.alloc=a;renderH();send(d.sid);if(allIn('alloc'))resolvePlan();return}

let S={code:'',sid:'',name:'',av:'',peer:null,conn:null,st:null,alloc:null,pick:null,deadline:0,lastTurn:-1};
function studentProfile(code){
 S.code=code;try{S.sid=localStorage.getItem('aihero_ops_sid')||Math.random().toString(36).slice(2,10);localStorage.setItem('aihero_ops_sid',S.sid);const p=JSON.parse(localStorage.getItem('aihero_ops_prof')||'null');if(p){S.name=p.name;S.av=p.av}}catch(e){S.sid=S.sid||Math.random().toString(36).slice(2,10)}
 S.av=S.av||AV[Math.floor(Math.random()*AV.length)];show('prof');
 $('avs').innerHTML=AV.map(a=>`<button class="av${a===S.av?' on':''}" data-a="${a}">${a}</button>`).join('');
 $('avs').querySelectorAll('.av').forEach(b=>b.onclick=()=>{S.av=b.dataset.a;$('avs').querySelectorAll('.av').forEach(x=>x.classList.toggle('on',x===b))});
 $('nameIn').value=S.name||'';
 $('joinGo').onclick=()=>{const v=$('nameIn').value.trim();if(!v){$('pmsg').textContent='별명을 써 주세요';return}S.name=v;try{localStorage.setItem('aihero_ops_prof',JSON.stringify({name:S.name,av:S.av}))}catch(e){}
  show('student');$('sAv').textContent=S.av;$('sNm').textContent=S.name;renderS();connectS()};
}
function connectS(){
 if(typeof Peer==='undefined'){$('sNet').textContent='연결 라이브러리를 불러오지 못했어요';return}
 if(!S.peer||S.peer.destroyed){S.peer=new Peer(undefined,PEERCFG);S.peer.on('open',dial);
  S.peer.on('error',e=>{$('sNet').textContent=e.type==='peer-unavailable'?'방을 찾을 수 없어요 · 다시 연결 중':'연결 문제 · 다시 시도 중';setTimeout(dial,3000)});
  S.peer.on('disconnected',()=>{try{S.peer.reconnect()}catch(e){}})}else dial();
}
function dial(){if(!S.peer||S.peer.destroyed||S.peer.disconnected)return;const c=S.peer.connect(PREFIX+S.code,{reliable:true});S.conn=c;
 c.on('open',()=>{$('sNet').textContent='연결됨 · 방 '+S.code;c.send({t:'join',sid:S.sid,name:S.name,av:S.av})});
 c.on('data',d=>{if(d&&d.t==='st'){const prev=S.st;S.st=d;S.deadline=Date.now()+(d.left||0);if(!prev||prev.turn!==d.turn||prev.phase!==d.phase){S.pick=null;if(d.phase==='plan')S.alloc=null}renderS()}});
 c.on('close',()=>{$('sNet').textContent='연결 끊김 · 다시 연결 중';setTimeout(dial,2000)});
}
let sT=null;
function renderS(){
 const d=S.st,b=$('sBody');clearInterval(sT);
 const me=d&&d.me;
 if(me){$('sZone').textContent=me.escaped?'탈출!':(me.zone+1)+'구역';$('sSteps').textContent=me.escaped?'-':me.steps+'/4';$('sRank').textContent=me.rank+'/'+me.n;
  $('sLet').innerHTML=ZONES.map((z,i)=>`<i class="${i<me.letters.length?'on':''}">${i<me.letters.length?z.L:'?'}</i>`).join('');$('sTurn').textContent=d.turn?`턴 ${Math.min(d.turn,d.turns)}/${d.turns}`:'대기'}
 else $('sLet').innerHTML=ZONES.map(()=>'<i>?</i>').join('');
 if(!d||d.phase==='lobby'){b.innerHTML=`<div class="wait"><div class="e">${esc(S.av)}</div><h2>입장 완료!</h2><p class="muted">선생님 화면에 내 로봇이 보이나요?<br>작전 시작을 기다려요</p></div>`;return}
 if(me&&me.escaped&&d.phase!=='end'){b.innerHTML=`<div class="wait"><div class="e">🎉</div><h2>탈출 성공!</h2><p class="muted">선생님 화면에서 친구들을 응원해요</p></div>`;return}
 const timer=()=>{const f=()=>{const t=$('sTm');if(t)t.textContent=Math.max(0,Math.ceil((S.deadline-Date.now())/1000))+'초'};f();sT=setInterval(f,300)};
 if(d.phase==='plan'){
  if(me.submitted){b.innerHTML=`<div class="wait"><div class="e">⚙️</div><h2>작전 제출 완료</h2><p class="muted">${ACTS.map(a=>a.ic+' '+(me.alloc?me.alloc[a.k]:0)).join(' · ')}</p><p class="muted">퀴즈를 기다려요</p></div>`;return}
  if(!S.alloc)S.alloc={move:0,data:0,shield:0,charge:0};
  const used=Object.values(S.alloc).reduce((a,b)=>a+b,0),left=me.energy-used;
  b.innerHTML=`<div class="ptitle"><h2>⚙️ 에너지 나누기</h2><span class="chip">⏱ <span id="sTm"></span></span></div>
  <div class="card" style="padding:12px 14px;display:flex;align-items:center;gap:12px"><b>남은 에너지 ${left}/${me.energy}</b><div class="energy">${Array.from({length:me.energy},(_,i)=>`<i class="${i<left?'':'off'}"></i>`).join('')}</div></div>
  <div class="alloc">${ACTS.map(a=>`<div class="card arow"><span class="ic">${a.ic}</span><div><b>${a.name}</b><p>${a.d}</p></div><div class="step"><button data-k="${a.k}" data-d="-1" ${S.alloc[a.k]<=0?'disabled':''}>−</button><span>${S.alloc[a.k]}</span><button data-k="${a.k}" data-d="1" ${left<=0?'disabled':''}>+</button></div></div>`).join('')}</div>
  <p class="muted" style="font-size:13px">남은 에너지는 제출할 때 자동으로 이동에 들어가요. 지금 문까지 ${ROOM-me.steps}걸음.</p>
  <button class="btn big" id="sub">작전 제출</button>`;
  b.querySelectorAll('.step button').forEach(x=>x.onclick=()=>{const k=x.dataset.k,dd=+x.dataset.d;const u=Object.values(S.alloc).reduce((a,b)=>a+b,0);if(dd>0&&u>=me.energy)return;S.alloc[k]=Math.max(0,S.alloc[k]+dd);tone(dd>0?660:440,.05,.03);renderS()});
  $('sub').onclick=()=>{try{S.conn.send({t:'alloc',sid:S.sid,a:S.alloc})}catch(e){}tone(784,.1)};timer();return}
 if(d.phase==='quiz'){
  if(me.answered||S.pick!==null){b.innerHTML=`<div class="wait"><div class="e">🔐</div><h2>답 제출!</h2><p class="muted">결과를 기다려요</p></div>`;return}
  const q=me.quiz;if(!q){b.innerHTML='<div class="wait"><h2>잠시만요…</h2></div>';return}
  b.innerHTML=`<div class="ptitle"><h2>${me.steps>=ROOM?'🚪 맞히면 문이 열려요!':'❓ 맞히면 1걸음 보너스'}</h2><span class="chip">⏱ <span id="sTm"></span></span></div>
  <div class="card qcard">${esc(q.q)}</div><div class="opts">${q.o.map((o,i)=>`<button class="opt ${q.gone.includes(i)?'gone':''}" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
  ${q.gone.length?`<p class="muted" style="font-size:13px">🧠 데이터 분석으로 오답 ${q.gone.length}개를 지웠어요</p>`:''}`;
  b.querySelectorAll('.opt').forEach(x=>x.onclick=()=>{if(S.pick!==null)return;S.pick=+x.dataset.i;try{S.conn.send({t:'ans',sid:S.sid,c:S.pick})}catch(e){}tone(700,.08);renderS()});timer();return}
 if(d.phase==='result'||d.phase==='event'){
  b.innerHTML=`<div class="wait">${d.ev?`<div class="e">${d.ev.ic}</div><h2>${esc(d.ev.t)}</h2><p class="muted">${esc(d.ev.d)}</p>`:`<div class="e">📋</div><h2>턴 ${d.turn} 결과</h2>`}
  <div class="log">${(me.log||[]).map(l=>`<div class="${l.c}">${esc(l.t)}</div>`).join('')}</div><p class="muted">다음 턴을 기다려요</p></div>`;return}
 if(d.phase==='end'){b.innerHTML=`<div class="wait"><div class="e">${me.rank<=3?['🥇','🥈','🥉'][me.rank-1]:esc(S.av)}</div><h2>작전 종료 · ${me.rank}등</h2><p class="muted">${me.escaped?'탈출 성공!':'아쉽게 탈출하지 못했어요'} · 모은 글자 ${me.letters.join('')||'없음'}</p><p class="muted">출구 암호는 HUMAN!</p></div>`;return}
}

/* ================= 시작 ================= */
$('toHost').onclick=hostStart;
$('toJoin').onclick=()=>{const c=$('codeIn').value.replace(/\D/g,'');if(c.length!==5){$('codeIn').focus();return}studentProfile(c)};
$('codeIn').onkeydown=e=>{if(e.key==='Enter')$('toJoin').click()};
if(params.has('host'))hostStart();else if(params.get('r'))studentProfile(params.get('r').replace(/\D/g,'').slice(0,5));
</script>
</body>
</html>
