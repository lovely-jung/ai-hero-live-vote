<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 연구소 탈출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;600;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{--bg:#0f1624;--panel:#18233a;--panel2:#20304d;--line:#2e4166;--fg:#eaf0fa;--muted:#9aaccc;--hz:#f4b43a;--algo:#ff5f7a;--ok:#4fd1a5;--blue:#5aa2ff;
--fd:"Black Han Sans","Gothic A1",sans-serif;--fb:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--fm:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:18px;line-height:1.55;
 background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 25%,transparent 25%,var(--bg) 85%);pointer-events:none}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--hz);outline-offset:2px}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--fd);font-weight:400;margin:0;letter-spacing:.01em}
h1{font-size:clamp(40px,8vw,68px);line-height:1.08}
h2{font-size:clamp(24px,4.6vw,34px);line-height:1.25}
.eyebrow{font-family:var(--fm);font-size:13px;letter-spacing:.14em;color:var(--hz);text-transform:uppercase}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px clamp(16px,4vw,30px) 24px;position:relative}
.panel::before{content:"";position:absolute;inset:0 0 auto;height:6px;border-radius:10px 10px 0 0;background:repeating-linear-gradient(-45deg,var(--hz) 0 12px,var(--bg) 12px 24px);opacity:.85}
.lead{color:var(--muted);margin:8px 0 0}
.btn{background:var(--hz);color:#111;border:0;border-radius:10px;padding:14px 26px;font-weight:800;font-size:19px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--muted);border:2px solid var(--line)}
.btn.blue{background:var(--blue);color:#0b1220}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:15px;color:var(--muted)}
.field input{font:inherit;font-size:22px;background:var(--bg);color:var(--fg);border:2px solid var(--line);border-radius:10px;padding:10px 14px;max-width:420px}
.avs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.av{width:52px;height:52px;font-size:28px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);display:grid;place-items:center}
.av.on{border-color:var(--hz);background:#3a3115}
/* HUD */
.hud{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.zones{display:flex;gap:6px}
.zn{width:44px;height:50px;border:2px solid var(--line);border-radius:6px 6px 0 0;background:var(--panel);display:grid;place-items:center;font-family:var(--fm);font-weight:600;color:var(--muted);position:relative}
.zn.now{border-color:var(--hz);color:var(--hz)}
.zn.open{background:var(--ok);border-color:var(--ok);color:#0b1220}
.stats{display:flex;gap:14px;font-family:var(--fm);font-size:16px;color:var(--muted);flex-wrap:wrap;align-items:center}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums;font-size:20px}
.hearts{font-size:22px;letter-spacing:2px}
.combo{color:var(--hz)!important}
.net{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.net.on{border-color:var(--ok);color:var(--ok)}
/* ALGO */
.algo{display:flex;gap:14px;align-items:flex-start}
.bot{flex:none;width:72px;height:62px;border:3px solid var(--algo);border-radius:12px;background:var(--panel);display:grid;place-items:center;position:relative}
.bot::after{content:"";position:absolute;bottom:-11px;left:50%;width:22px;height:8px;transform:translateX(-50%);background:var(--line);border-radius:0 0 4px 4px}
.eye{width:28px;height:28px;border-radius:50%;background:var(--algo);box-shadow:0 0 18px var(--algo);animation:blink 4s infinite}
.bot.calm{border-color:var(--ok)} .bot.calm .eye{background:var(--ok);box-shadow:0 0 18px var(--ok)}
.bot.shake{animation:shake .4s}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.bubble{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 16px}
.bubble .who{font-family:var(--fm);font-size:12px;letter-spacing:.12em;color:var(--algo)}
.bot.calm+.bubble .who{color:var(--ok)}
.bubble p{margin:0}
/* question */
.timer{height:10px;border-radius:999px;background:var(--panel2);overflow:hidden;margin:10px 0 4px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--hz),var(--algo));transform-origin:left;transition:transform .2s linear}
.q{font-size:21px;font-weight:700;margin:12px 0 14px}
.choices{display:grid;gap:10px}
.ch{text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:14px 16px;font-size:18px;display:flex;gap:12px;align-items:flex-start;transition:border-color .12s,transform .08s}
.ch:hover{border-color:var(--hz)} .ch:active{transform:scale(.99)}
.ch .k{font-family:var(--fm);font-weight:600;color:var(--hz);flex:none}
.ch.wrong{border-color:var(--algo);opacity:.5} .ch.right{border-color:var(--ok);background:#1d4a3f}
.ch.gone{visibility:hidden}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ox .ch{justify-content:center;font-family:var(--fd);font-size:56px;padding:18px}
.picked{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:8px;border:2px dashed var(--line);border-radius:10px;margin-bottom:10px}
.chip{background:var(--hz);color:#111;font-weight:800;border-radius:6px;padding:6px 10px;font-size:16px}
.kp{display:flex;flex-wrap:wrap;gap:20px}
.legend{flex:1 1 260px;display:grid;gap:8px}
.legend div{display:flex;justify-content:space-between;background:var(--panel2);border-radius:6px;padding:8px 12px}
.legend span:last-child{font-family:var(--fm);color:var(--hz)}
.keys{flex:0 1 250px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.screen{grid-column:1/-1;font-family:var(--fm);font-size:30px;letter-spacing:.4em;text-align:center;background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:8px 0;min-height:56px}
.key{background:var(--panel2);border:2px solid var(--line);border-radius:8px;padding:12px 0;font-family:var(--fm);font-size:22px;font-weight:600}
.key.fn{font-family:var(--fb);font-size:15px}
.mock{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;background:#e9f9ee;border-radius:12px;padding:14px}
.mock .ch{background:#fff;color:#14331f;border-color:#c9e8d3;flex-direction:column;align-items:center;text-align:center}
.mock .ch small{color:#16804a;font-weight:700}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.feedback{margin-top:12px;padding:10px 14px;border-left:4px solid var(--ok);background:var(--panel2);border-radius:0 8px 8px 0}
.feedback.bad{border-color:var(--algo)}
.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--fd);font-size:44px;color:var(--hz);text-shadow:0 4px 18px #000;pointer-events:none;z-index:9;animation:pop .9s forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.fx{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0}
.fx.bad{background:var(--algo);animation:flash .35s}.fx.good{background:var(--ok);animation:flash .45s}
@keyframes flash{0%{opacity:.25}100%{opacity:0}}
.letters{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.letter{width:56px;height:64px;display:grid;place-items:center;font-family:var(--fm);font-size:32px;font-weight:600;border:2px solid var(--ok);border-radius:6px;color:var(--ok)}
.letter.empty{border-style:dashed;border-color:var(--line);color:var(--line)}
.lesson{margin-top:12px;padding:12px 16px;border:1px solid var(--ok);border-radius:8px}
.lesson b{color:var(--ok)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--panel2);border-radius:8px;padding:12px 16px}
.stat span{display:block;font-size:14px;color:var(--muted)}
.stat b{font-family:var(--fm);font-size:30px}
.small{font-size:14px;color:var(--muted)}
.rank{font-family:var(--fd);font-size:40px;color:var(--hz)}
/* TEACHER */
.tgrid{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
@media(max-width:820px){.tgrid{grid-template-columns:1fr}}
.code{font-family:var(--fm);font-size:56px;font-weight:600;letter-spacing:.12em;color:var(--hz)}
.qr svg{width:100%;height:auto;background:#fff;border-radius:10px}
.url{font-family:var(--fm);font-size:14px;word-break:break-all;color:var(--muted)}
.board{display:flex;flex-direction:column;gap:8px}
.lane{display:grid;grid-template-columns:44px 140px 1fr 90px;gap:10px;align-items:center;background:var(--panel2);border-radius:10px;padding:8px 12px}
.lane .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane .ic{font-size:28px;text-align:center}
.track{position:relative;height:30px;border-radius:999px;background:var(--bg);overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#2c5b9c,var(--ok));border-radius:999px;transition:width .4s}
.track span{position:absolute;inset:0;display:flex;align-items:center;padding-left:10px;font-size:13px;font-family:var(--fm)}
.lane .sc{font-family:var(--fm);font-size:20px;text-align:right}
.lane.done{outline:2px solid var(--ok)}
.lane.off{opacity:.5}
.podium{display:flex;gap:14px;justify-content:center;align-items:flex-end;margin:10px 0 4px}
.pd{background:var(--panel2);border-radius:12px 12px 0 0;padding:12px;text-align:center;width:170px}
.pd .ic{font-size:44px}.pd b{display:block;font-size:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="fx" id="fx"></div>
<script>
"use strict";
/* ============ 문제 은행 (인공지능 히어로 1~5교시) ============ */
const ZONES=[
 {name:"정체 확인실",letter:"H",topic:"1교시 · 왜, 인공지능?",
  intro:"후후, 정체 확인실이다. AI랑 AI 아닌 것도 구별 못 하면 여기서 못 나가!",
  lesson:"<b>1교시 정리</b> 데이터로 배워서 판단하는 게 AI. 챗GPT·알파고는 한 가지 일을 잘하는 약한 AI. AI 실력을 정하는 건 데이터!",
  pool:[
  {t:"choice",q:"다음 중 AI가 아닌 것은?",o:["넷플릭스 영화 추천","유튜브 자동 자막","계산기 앱의 3×7=21","얼굴 인식 잠금 해제"],a:2,hint:"사람이 정한 규칙대로만 계산하는 건?"},
  {t:"choice",q:"챗GPT와 알파고는 어떤 AI일까요?",o:["강한 AI","약한 AI (한 분야를 잘하는 AI)","초지능 AI","AI가 아닌 프로그램"],a:1,hint:"알파고는 바둑 최강이지만 라면은 못 끓여요."},
  {t:"choice",q:"AI의 실력을 결정하는 가장 중요한 것은?",o:["화면 크기","데이터","프로그램 이름","전기 요금"],a:1,hint:"AI는 무엇을 보고 배울까요?"},
  {t:"ox",q:"AI는 모르는 질문을 받으면 항상 '모른다'고 답한다.",a:false,hint:"그럴듯하게 지어낼 때도 있었죠?"},
  {t:"ox",q:"로봇은 모두 AI다.",a:false,hint:"정해진 동작만 반복하는 로봇도 있어요."},
  {t:"choice",q:"AI가 사실이 아닌 내용을 그럴듯하게 지어내는 것을 무엇이라고 할까요?",o:["할루시네이션(환각)","업데이트","로그인","다운로드"],a:0,hint:"AI가 꿈꾸듯 헛것을 본다는 뜻!"},
  {t:"choice",q:"'컴퓨터(computer)'는 원래 무엇을 부르는 말이었을까요?",o:["계산하는 사람","전자 기계","게임기","전화기"],a:0,hint:"1교시: NASA의 '인간 컴퓨터'"}
 ]},
 {name:"얼굴 학습실",letter:"U",topic:"2교시 · AI 닮은꼴과 디지털 윤리",
  intro:"얼굴 학습실이다. 나는 연예인 사진 세 장 보고 배워서 모두를 같은 배우라고 하지. 크크.",
  lesson:"<b>2교시 정리</b> 컴퓨터에게 사진은 숫자 바둑판. 데이터 모으기 → 학습 → 테스트. 얼굴은 주인의 것!",
  pool:[
  {t:"choice",q:"컴퓨터에게 사진은 무엇으로 보일까요?",o:["숫자들이 모인 바둑판(픽셀)","사람 눈과 같은 그림","글자 설명","소리 파형"],a:0,hint:"사진을 확대하면 작은 네모 칸!"},
  {t:"order",q:"티처블 머신으로 닮은꼴 AI를 만드는 순서대로 누르세요.",items:["학습시키기","새 사진으로 테스트","사진(데이터) 모으기"],a:[2,0,1],hint:"공부 재료 → 공부 → 시험"},
  {t:"choice",q:"인터넷에서 얼굴 사진 수십억 장을 허락 없이 모아 얼굴 인식 AI를 만든 회사가 여러 나라에서 벌금을 받았어요. 가장 큰 문제는?",o:["사진 화질","얼굴 주인의 동의 없이 모았다","AI 이름","컴퓨터 속도"],a:1,hint:"얼굴의 주인은 누구?"},
  {t:"choice",q:"얼굴 인식 AI가 어떤 사람들의 얼굴을 더 자주 틀리는 이유로 가장 알맞은 것은?",o:["그 사람들이 사진을 싫어해서","학습 데이터에 그런 얼굴이 적어서","카메라가 고장 나서","AI가 일부러 틀려서"],a:1,hint:"AI는 본 만큼만 알아봐요."},
  {t:"ox",q:"친구 얼굴을 허락 없이 AI로 합성해 단톡방에 올려도 장난이면 괜찮다.",a:false,hint:"내 얼굴이라면?"},
  {t:"ox",q:"닮은꼴 AI가 '87% 닮음'이라고 하면, 과학적으로 87% 닮았다는 뜻이다.",a:false,hint:"AI는 배운 사진 중 가장 비슷한 쪽을 고를 뿐이에요."}
 ]},
 {name:"미래 직업실",letter:"M",topic:"3교시 · AI와 미래 직업",
  intro:"미래 직업실이다. 내가 너희 일자리를 몽땅 가져갈 거다! …라고 믿겠지?",
  lesson:"<b>3교시 정리</b> AI는 직업을 없애기보다 그 안의 '일'을 바꿔요. 새 직업 = 문제 + AI 기술 + 사람의 강점!",
  pool:[
  {t:"choice",q:"ATM이 생긴 뒤 은행원은 어떻게 됐을까요?",o:["모두 사라졌다","돈 세는 일은 줄고 상담 같은 일이 늘었다","ATM만 고친다","전혀 안 바뀌었다"],a:1,hint:"직업은 사라지지 않고, ○이 바뀐다."},
  {t:"choice",q:"3교시 새 직업 발명 공식은?",o:["문제 + AI 기술 + 사람의 강점","돈 + 유행 + 운","AI + AI + AI","연예인 + 게임"],a:0,hint:"사람이 잘하는 것도 들어가요."},
  {t:"choice",q:"캔바 동영상에서 AI로 장면 이미지를 만드는 앱은?",o:["Magic Media","계산기","메모장","휴지통"],a:0,hint:"마법 같은 미디어!"},
  {t:"ox",q:"대부분의 직업은 AI 때문에 완전히 사라진다.",a:false,hint:"대부분은 '바뀜'이었어요."},
  {t:"choice",q:"AI 이미지 프롬프트로 가장 좋은 것은?",o:["멋지게","의사","병원에서 AI 로봇과 환자를 돌보는 간호사, 3D 일러스트","아무거나"],a:2,hint:"누가 + 어디서 + 무엇을 + 어떤 그림체"}
 ]},
 {name:"서비스 기획실",letter:"A",topic:"4교시 · 내 일상에 AI 더하기",
  intro:"서비스 기획실이다. 불편함? 그딴 거 몰라. 나는 아무거나 만들지!",
  lesson:"<b>4교시 정리</b> AI 서비스 = 관심 영역 + 불편함 + How?(AI 능력) + 데이터. 디자인씽킹: 공감 → 정의 → 아이디어 → 프로토타입 → 테스트!",
  pool:[

 if(S.hearts<=0){S.traps++;S.score=Math.max(0,S.score-150);S.hearts=HEARTS;say('하트가 다 떨어졌다! ALGO의 함정에 걸려 150점을 빼앗겼지만… 하트는 다시 채워 줄게. 크크.');popText('함정! -150')}
 const sc=$('sc');if(sc)sc.textContent=S.score;
 const h=app.querySelector('.hearts');if(h)h.textContent='❤️'.repeat(S.hearts)+'🖤'.repeat(Math.max(0,HEARTS-S.hearts));
 const c=app.querySelector('.combo b');if(c)c.textContent=0;
 save();report();
}
function renderZone(){
 clearInterval(tickT);const Z=ZONES[S.zone],last=S.zone===ZONES.length-1;
 app.innerHTML=algo(last?"안 돼… 마지막 구역까지! 출구 암호만은 절대 못 풀 거야!":`끄응… ${Z.name} 문이 열렸다. 다음은 쉽지 않을걸?`)+hud()+
 `<main class="panel"><div class="eyebrow">${S.zone+1}구역 통과!</div><h2>${esc(Z.name)} 문이 열렸다!</h2><p class="lead">비밀 글자 획득!</p>
 <div class="letters">${ZONES.map((z,i)=>`<div class="letter${i<S.letters.length?'':' empty'}">${i<S.letters.length?S.letters[i]:'?'}</div>`).join('')}</div>
 <div class="lesson">${Z.lesson}</div><div class="row"><button class="btn" id="nx">${last?'출구로 가기 ▶':'다음 구역으로 ▶'}</button></div></main>`;
 netChip();
 $('nx').onclick=()=>{if(last){S.stage='final'}else{S.zone++;S.stage='play';setupZone()}save();report();render()};
}
function renderFinal(){
 app.innerHTML=algo("출구 암호는 영어 다섯 글자. AI를 만들고, 가르치고, 책임지는 진짜 주인이 누군지 안다면… 아니, 몰라야 해!")+hud()+
 `<main class="panel"><div class="eyebrow">출구 · 최종 보안 문</div><h2>출구 암호를 입력하세요</h2>
 <div class="letters">${S.letters.map(l=>`<div class="letter">${l}</div>`).join('')}</div>
 <div class="field"><label for="pw">출구 암호 (영어)</label><input id="pw" maxlength="10" autocomplete="off" autocapitalize="characters" placeholder="다섯 글자"></div>
 <div class="row"><button class="btn" id="op">문 열기</button></div><p class="small" id="pm" aria-live="polite"></p></main>`;
 netChip();
 const go=()=>{const v=$('pw').value.replace(/\s+/g,'').toUpperCase();if(!v)return;
  if(v==='HUMAN'){S.end=Date.now();S.score+=Math.max(0,300-Math.floor((S.end-S.start)/1000));S.stage='done';save();report();sWin();flash('good');render()}
  else{bad();$('pm').textContent='틀렸어요. 모은 글자를 순서대로 읽어 보세요.'}};
 $('op').onclick=go;$('pw').onkeydown=e=>{if(e.key==='Enter')go()};
}
function renderDone(){
 clearInterval(tickT);const t=S.end-S.start;
 app.innerHTML=algo("시스템 종료 중… 그래, 너희 말이 맞아. AI를 이끄는 건 결국 사람이야.",true)+
 `<main class="panel"><div class="eyebrow">탈출 성공</div><h1>${esc(S.av)} ${esc(S.name)} 탈출!</h1>
 <div class="letters">${'HUMAN'.split('').map(l=>`<div class="letter">${l}</div>`).join('')}</div>
 <div class="grid3"><div class="stat"><span>최종 점수</span><b>${S.score}</b></div><div class="stat"><span>탈출 시간</span><b>${fmt(t)}</b></div><div class="stat"><span>최고 콤보</span><b>${S.best}</b></div><div class="stat"><span>정답 / 오답</span><b>${S.correct} / ${S.wrong}</b></div></div>
 <p class="lead">AI는 데이터로 배우지만, 그 데이터를 고르고 결과를 확인하고 책임지는 건 사람(HUMAN)이에요. 시간 보너스: 300초 안에 탈출하면 남은 초만큼 추가 점수!</p>
 <div class="row"><button class="btn ghost" id="again">다시 도전 (점수 새로 시작)</button></div></main>`;
 $('again').onclick=()=>{if(!confirmAgain){confirmAgain=true;$('again').textContent='정말 처음부터? 한 번 더 누르세요';return}const keep={name:S.name,av:S.av,code:S.code,sid:S.sid};S=Object.assign(freshS(),keep);save();render()};
}
let confirmAgain=false;

/* ============ 교사 화면 (?host) ============ */
let T=null;
function teacher(){
 T={code:params.get('code')||String(Math.floor(10000+Math.random()*90000)),stu:{},peer:null,showPodium:false};
 try{const sv=JSON.parse(sessionStorage.getItem('aihero_escape_t')||'null');if(sv&&sv.code&&!params.get('code')){T.code=sv.code;T.stu=sv.stu||{};for(const k in T.stu)T.stu[k].online=false}}catch(e){}
 openHost();renderT();setInterval(renderT,1000);
}
function saveT(){try{sessionStorage.setItem('aihero_escape_t',JSON.stringify({code:T.code,stu:T.stu}))}catch(e){}}
function openHost(){
 if(typeof Peer==='undefined'){T.err='연결 라이브러리를 불러오지 못했어요. 인터넷을 확인하세요.';return}
 const p=new Peer(PREFIX+T.code,PEERCFG);T.peer=p;
 p.on('open',()=>{T.err='';T.ready=true});
 p.on('connection',c=>{c.on('data',d=>{if(!d||d.t!=='prog'||!d.sid)return;const name=String(d.name||'').slice(0,10);T.stu[d.sid]=Object.assign(T.stu[d.sid]||{},{name,av:String(d.av||'🙂').slice(0,4),zone:Math.min(5,Math.max(0,+d.zone||0)),score:Math.max(0,+d.score||0),hearts:+d.hearts||0,done:!!d.done,time:+d.time||0,online:true,conn:c});saveT()});
  c.on('close',()=>{for(const k in T.stu)if(T.stu[k].conn===c)T.stu[k].online=false})});
 p.on('error',e=>{if(e.type==='unavailable-id'){T.code=String(Math.floor(10000+Math.random()*90000));saveT();setTimeout(openHost,300)}else{T.err='연결 문제 · 다시 시도 중';setTimeout(()=>{try{p.reconnect()}catch(_){}},3000)}});
 p.on('disconnected',()=>{try{p.reconnect()}catch(e){}});
}
function joinURL(){return location.origin+location.pathname+'?r='+T.code}
function renderT(){
 const list=Object.entries(T.stu).map(([k,v])=>Object.assign({sid:k},v)).sort((a,b)=>(b.done-a.done)||(b.score-a.score));
 const done=list.filter(s=>s.done).length;
 let qr='';try{const q=qrcode(0,'M');q.addData(joinURL());q.make();qr=q.createSvgTag({cellSize:6,margin:2,scalable:true})}catch(e){}
 const lanes=list.map((s,i)=>`<div class="lane${s.done?' done':''}${s.online?'':' off'}"><div class="ic">${esc(s.av)}</div><div class="nm">${i+1}. ${esc(s.name)}</div><div class="track"><i style="width:${(s.done?6:s.zone)/6*100}%"></i><span>${s.done?'탈출! '+fmt(s.time):(s.zone+1)+'구역'}</span></div><div class="sc">${s.score}</div></div>`).join('')||'<p class="lead">아직 들어온 학생이 없어요. 학생들이 방 코드를 넣고 시작하면 여기에 나타나요.</p>';
 const top=list.slice(0,3);
 const pod=T.showPodium&&top.length?`<div class="podium">${[top[1],top[0],top[2]].map((s,i)=>s?`<div class="pd" style="height:${[150,200,120][i]}px"><div class="ic">${esc(s.av)}</div><b>${esc(s.name)}</b><span class="rank">${[2,1,3][i]}</span></div>`:'').join('')}</div>`:'';
 app.innerHTML=`<div class="tgrid"><main class="panel"><div class="eyebrow">선생님 화면 · 방 코드</div><div class="code">${T.code}</div><div class="qr">${qr}</div><p class="url">${esc(joinURL())}</p>
 <p class="small">${T.err?esc(T.err):(T.ready?'학생 접속 대기 중':'연결 준비 중…')}</p>
 <div class="row"><button class="btn blue" id="pod">${T.showPodium?'순위표로':'🏆 시상대 보기'}</button><button class="btn ghost" id="clr">명단 비우기</button></div></main>
 <main class="panel"><div class="eyebrow">실시간 순위 · 참가 ${list.length}명 · 탈출 ${done}명</div><h2>AI 연구소 탈출 레이스</h2>${pod}<div class="board" style="margin-top:12px">${lanes}</div></main></div>`;
 $('pod').onclick=()=>{T.showPodium=!T.showPodium;renderT()};
 $('clr').onclick=()=>{if($('clr').dataset.c){T.stu={};saveT();renderT()}else{$('clr').dataset.c=1;$('clr').textContent='정말 비울까요? 한 번 더'}};
}

/* ============ 시작 ============ */
if(params.has('host')){document.body.style.fontSize='19px';app.style.maxWidth='1280px';teacher()}
else{S=load();if(params.get('r')&&S.stage==='start')S.code=params.get('r');render();if(S.stage!=='start'&&S.stage!=='done'){netConnect()}
 setInterval(()=>{if(S&&S.stage!=='start'&&S.stage!=='done')report()},5000)}
</script>
</body>
</html>
