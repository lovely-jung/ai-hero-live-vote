<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 연구소 탈출 레이스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;700;800&family=IBM+Plex+Mono:wght@600&display=swap">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{--bg:#120d2b;--bg2:#1c1442;--panel:#241a55;--line:#3b2f7a;--fg:#f4f1ff;--muted:#b7aee6;--y:#ffd23f;--r:#ff4d6d;--g:#2ee6a6;--b:#4cc9f0;--p:#9b5cff;
--A:#e21b3c;--B:#1368ce;--C:#d89e00;--D:#26890c;--fd:"Black Han Sans","Gothic A1",sans-serif;--fb:"Gothic A1","Malgun Gothic",sans-serif;--fm:"IBM Plex Mono",monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#3a2690 0%,var(--bg) 60%);color:var(--fg);font-family:var(--fb);overflow-x:hidden}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0}
h1,h2,h3{font-family:var(--fd);font-weight:400;margin:0}
.btn{background:var(--y);color:#1a1333;border-radius:14px;padding:14px 28px;font-weight:800;font-size:22px;box-shadow:0 6px 0 #b8901a}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b8901a}
.btn.ghost{background:transparent;color:var(--muted);border:2px solid var(--line);box-shadow:none}
.btn.big{font-size:30px;padding:18px 42px}
/* ===== landing ===== */
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px;text-align:center}
.logo{font-family:var(--fd);font-size:clamp(46px,9vw,96px);line-height:1;background:linear-gradient(90deg,var(--y),#ff8a3d,var(--r));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px #0008)}
.sub{color:var(--muted);font-size:20px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:24px;width:min(560px,100%)}
.card input{width:100%;font:inherit;font-size:30px;text-align:center;background:#130e30;color:var(--fg);border:3px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.avs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:10px 0}
.av{font-size:30px;aspect-ratio:1;border-radius:12px;background:#130e30;border:2px solid var(--line)}
.av.on{border-color:var(--y);background:#3d3210;transform:scale(1.08)}
/* ===== host ===== */
#host{min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;padding:14px 24px}
.top .code{font-family:var(--fm);font-size:30px;background:#fff;color:#1a1333;border-radius:12px;padding:4px 16px}
.top .info{color:var(--muted);font-size:18px}
.top .sp{flex:1}
.stage{flex:1;display:flex;flex-direction:column;padding:0 24px 20px;gap:16px}
.lobby{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
.qrbox{background:#fff;border-radius:18px;padding:14px;color:#1a1333;text-align:center}
.qrbox svg{width:100%;height:auto}
.qrbox .c{font-family:var(--fm);font-size:52px;letter-spacing:.1em}
.qrbox .u{font-size:14px;word-break:break-all}
.crowd{display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start;min-height:300px}
.kid{display:flex;flex-direction:column;align-items:center;animation:pop .4s}
.kid .e{font-size:54px;animation:bob 1.2s ease-in-out infinite}
.kid .n{font-weight:800;font-size:16px;background:#0006;border-radius:999px;padding:2px 10px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
/* question */
.qhead{display:flex;align-items:center;gap:18px}
.zone-tag{font-family:var(--fd);font-size:22px;background:var(--p);border-radius:999px;padding:6px 18px}
.qtext{font-family:var(--fd);font-size:clamp(30px,3.4vw,52px);line-height:1.25;background:#fff;color:#1a1333;border-radius:20px;padding:22px 30px;text-align:center}
.qmid{display:flex;align-items:center;gap:24px}
.timer{width:120px;height:120px;border-radius:50%;background:var(--p);display:grid;place-items:center;font-family:var(--fd);font-size:56px;flex:none;box-shadow:0 0 0 8px #9b5cff44}
.timer.low{background:var(--r);animation:shake .5s infinite}
.answered{font-family:var(--fd);font-size:28px;text-align:center;flex:none;width:150px}
.answered b{display:block;font-size:64px}
.algoq{flex:1;display:flex;align-items:center;justify-content:center;gap:14px;font-size:22px;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{display:flex;align-items:center;gap:16px;border-radius:16px;padding:22px 24px;font-size:clamp(22px,2.2vw,34px);font-weight:800;color:#fff;min-height:96px;position:relative;transition:opacity .3s,transform .3s}
.opt .sh{font-size:40px;flex:none}
.opt .cnt{margin-left:auto;font-family:var(--fd);font-size:36px}
.oA{background:var(--A)}.oB{background:var(--B)}.oC{background:var(--C)}.oD{background:var(--D)}
.opt.dim{opacity:.25;transform:scale(.97)}
.opt.win{outline:6px solid #fff;transform:scale(1.02)}
.opt.win::after{content:"✔";position:absolute;right:-12px;top:-14px;background:#fff;color:var(--D);border-radius:50%;width:44px;height:44px;display:grid;place-items:center;font-size:28px}
/* race track */
.trackwrap{position:relative;flex:1;min-height:420px;border-radius:22px;overflow:hidden;background:linear-gradient(#1b1440,#120d2b)}
.zones{position:absolute;inset:0;display:flex}
.zseg{flex:1;border-right:3px dashed #ffffff22;position:relative}
.zseg:nth-child(odd){background:#ffffff06}
.zseg .lab{position:absolute;top:10px;left:12px;font-family:var(--fd);font-size:20px;color:#ffffff88}
.zseg .lt{position:absolute;top:8px;right:10px;font-family:var(--fm);font-size:24px;width:40px;height:44px;border:2px dashed #ffffff44;border-radius:6px;display:grid;place-items:center;color:#ffffff44}
.zseg .lt.on{border:2px solid var(--g);color:var(--g);background:#2ee6a622}
.exit{position:absolute;right:0;top:0;bottom:0;width:70px;background:repeating-linear-gradient(0deg,#fff 0 22px,#1a1333 22px 44px);opacity:.9}
.exit span{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(90deg);font-family:var(--fd);font-size:30px;color:var(--r);background:#fff;padding:2px 12px;border-radius:8px;white-space:nowrap}
.runner{position:absolute;transition:left 2.4s cubic-bezier(.3,.9,.4,1),top .6s;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%)}
.runner .e{font-size:44px;line-height:1}
.runner.run .e{animation:run .25s linear infinite}
.runner .n{font-size:13px;font-weight:800;background:#000a;border-radius:999px;padding:1px 8px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.runner.top3 .n{background:var(--y);color:#1a1333}
.runner.trip .e{animation:trip .6s}
@keyframes run{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}
@keyframes trip{0%{transform:rotate(0)}40%{transform:rotate(80deg) translateY(10px)}100%{transform:rotate(0)}}
.algo{position:absolute;top:0;bottom:0;transition:left 2.4s ease-in-out;width:0}
.algo .beam{position:absolute;top:0;bottom:0;right:0;width:60vw;background:linear-gradient(90deg,transparent,#ff4d6d33);}
.algo .bot{position:absolute;top:50%;right:-46px;transform:translateY(-50%);width:92px;height:80px;border:4px solid var(--r);border-radius:16px;background:#2a1030;display:grid;place-items:center;box-shadow:0 0 30px #ff4d6d88}
.algo .eye{width:36px;height:36px;border-radius:50%;background:var(--r);box-shadow:0 0 22px var(--r);animation:blink 3s infinite}
.algo .say{position:absolute;top:calc(50% - 90px);right:-60px;background:var(--r);color:#fff;font-weight:800;border-radius:12px;padding:6px 12px;white-space:nowrap;font-size:16px}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.bar{display:flex;gap:14px;align-items:center}
.bar .msg{flex:1;font-family:var(--fd);font-size:30px}
.lead5{display:flex;gap:10px}
.lead5 div{background:var(--panel);border-radius:12px;padding:6px 14px;font-weight:800;font-size:18px}
/* zone clear / podium */
.bigmsg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.bigmsg .t{font-family:var(--fd);font-size:clamp(50px,7vw,110px);line-height:1.05}
.letters{display:flex;gap:14px}
.letter{width:96px;height:110px;border-radius:14px;border:4px solid var(--g);display:grid;place-items:center;font-family:var(--fm);font-size:64px;color:var(--g);background:#2ee6a611;animation:pop .5s}
.letter.empty{border-style:dashed;border-color:var(--line);color:var(--line);background:none}
.podium{display:flex;align-items:flex-end;gap:20px;justify-content:center}
.pd{width:220px;border-radius:18px 18px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:16px;gap:6px;animation:rise 1s}
.pd .e{font-size:80px}.pd b{font-size:26px}.pd .rk{font-family:var(--fd);font-size:60px}
@keyframes rise{from{transform:translateY(200px);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* ===== student ===== */
#student{min-height:100vh;display:flex;flex-direction:column}
.shead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0005}
.shead .me{font-size:30px}.shead .nm{font-weight:800;flex:1}.shead .sc{font-family:var(--fm);background:#fff;color:#1a1333;border-radius:8px;padding:2px 10px}
.sbody{flex:1;display:flex;flex-direction:column;padding:14px;gap:12px}
.sq{background:#fff;color:#1a1333;border-radius:14px;padding:14px 16px;font-weight:800;font-size:20px;text-align:center}
.sopts{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sopt{border-radius:16px;color:#fff;font-weight:800;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;min-height:120px;box-shadow:0 6px 0 #0006}
.sopt .sh{font-size:48px}
.sopt:active{transform:translateY(4px);box-shadow:0 2px 0 #0006}
.swait{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.swait .e{font-size:110px;animation:bob 1.2s infinite}
.swait .t{font-family:var(--fd);font-size:40px}
.swait.ok{background:radial-gradient(circle,#2ee6a644,transparent 70%)}
.swait.no{background:radial-gradient(circle,#ff4d6d44,transparent 70%)}
.status{font-size:13px;color:var(--muted);text-align:center;padding:6px}
@media (max-width:700px){.lobby{grid-template-columns:1fr}.opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="landing" class="center">
  <div class="logo">AI 연구소 탈출 레이스</div>
  <div class="sub">ALGO 로봇에게 잡히기 전에 연구소를 빠져나가라!</div>
  <div class="card">
    <input id="codeIn" inputmode="numeric" maxlength="5" placeholder="방 코드 5자리" autocomplete="off">
    <button class="btn big" id="toJoin" style="width:100%">입장하기</button>
  </div>
  <button class="btn ghost" id="toHost">선생님: 방 만들기</button>
</div>

<div id="prof" class="center hidden">
  <div class="logo" style="font-size:48px">내 캐릭터 고르기</div>
  <div class="card">
    <div class="avs" id="avs"></div>
    <input id="nameIn" maxlength="8" placeholder="별명 (실명 X)" autocomplete="off">
    <button class="btn big" id="joinGo" style="width:100%">레이스 참가!</button>
    <p class="status" id="pmsg"></p>
  </div>
</div>

<div id="host" class="hidden">
  <div class="top"><b style="font-family:var(--fd);font-size:26px">AI 연구소 탈출 레이스</b><span class="code" id="hCode">-----</span><span class="info" id="hInfo"></span><span class="sp"></span><button class="btn ghost" id="mute">🔊</button></div>
  <div class="stage" id="stage"></div>
</div>

<div id="student" class="hidden">
  <div class="shead"><span class="me" id="sAv"></span><span class="nm" id="sNm"></span><span class="sc" id="sSc">0</span></div>
  <div class="sbody" id="sBody"></div>
  <div class="status" id="sStatus">연결 중…</div>
</div>
<div class="confetti" id="conf"></div>

<script>
"use strict";
/* ===== 문제 15개 (구역당 3개 · 인공지능 히어로 1~6교시) ===== */
const ZONES=[
 {name:"정체 확인실",short:"1구역 · 1교시",letter:"H",qs:[
  {q:"다음 중 AI가 아닌 것은?",o:["넷플릭스 영화 추천","유튜브 자동 자막","계산기의 3×7=21","얼굴 인식 잠금"],a:2},
  {q:"AI의 실력을 결정하는 가장 중요한 것은?",o:["화면 크기","데이터","프로그램 이름","전기 요금"],a:1},
  {q:"AI는 모르는 질문에 항상 '모른다'고 답한다.",o:["O","X"],a:1,ox:1}]},
 {name:"얼굴 학습실",short:"2구역 · 2교시",letter:"U",qs:[
  {q:"컴퓨터에게 사진은 무엇으로 보일까?",o:["숫자 바둑판(픽셀)","사람 눈과 같은 그림","글자 설명","소리"],a:0},
  {q:"얼굴 사진 수십억 장을 허락 없이 모아 벌금을 낸 회사. 가장 큰 문제는?",o:["사진 화질","주인의 동의 없이 모았다","AI 이름","컴퓨터 속도"],a:1},
  {q:"친구 얼굴을 허락 없이 AI로 합성해 단톡방에 올려도 장난이면 괜찮다.",o:["O","X"],a:1,ox:1}]},
 {name:"미래 직업실",short:"3구역 · 3교시",letter:"M",qs:[
  {q:"ATM이 생긴 뒤 은행원은?",o:["모두 사라졌다","돈 세는 일↓ 상담 같은 일↑","ATM만 고친다","전혀 안 바뀜"],a:1},
  {q:"새 직업 발명 공식은?",o:["문제 + AI 기술 + 사람의 강점","돈 + 유행 + 운","AI + AI + AI","연예인 + 게임"],a:0},
  {q:"캔바 동영상에서 AI로 장면 이미지를 만드는 앱은?",o:["Magic Media","계산기","메모장","휴지통"],a:0}]},
 {name:"서비스 기획실",short:"4구역 · 4교시",letter:"A",qs:[
  {q:"디자인씽킹의 첫 단계는?",o:["프로토타입","공감","테스트","아이디어"],a:1},
  {q:"번역 앱이 주로 쓰는 AI 능력은?",o:["시각","청각","언어","예측"],a:2},
  {q:"급식 잔반을 줄이는 AI에게 알맞은 데이터는?",o:["학생 집 주소","남긴 양 사진·날씨·메뉴","전교생 성적표","인기 동영상"],a:1}]},
 {name:"앱 통제실",short:"5구역 · 5~6교시",letter:"N",qs:[
  {q:"ALGO 앱의 버그는? 🧴투명 페트병 → ?",o:["플라스틱(투명 페트병)","음식물쓰레기","종이류","캔류"],a:1,bug:1},
  {q:"앱을 고칠 때 가장 좋은 요청은?",o:["더 좋게 해 줘","이상한 거 다 고쳐 줘","'다' 버튼을 '다 쓴 볼펜'으로 바꿔 줘","알아서 해"],a:2},
  {q:"'AI 자율주행 버스 → 버스 기사 일자리 감소' 다음 2차 영향은?",o:["기사 재교육·새 직업 프로그램","버스 색이 바뀐다","걷기를 싫어한다","AI가 운전 안 함"],a:0}]}
];
const QLIST=[];ZONES.forEach((z,zi)=>z.qs.forEach((q,k)=>QLIST.push(Object.assign({zi,k},q))));
const QT=20; // seconds
const SH=['▲','◆','●','■'],CL=['oA','oB','oC','oD'],CLS=['var(--A)','var(--B)','var(--C)','var(--D)'];
const AV=['🐶','🐱','🦊','🐼','🐸','🐯','🐰','🐻','🐨','🐵','🐧','🦁','🐙','🦄','🐲','🦖','🐥','🦉','🐳','🦋','🐝','🐹','🤖','👾','🐢','🦈','🐿️','🦔','🐌','🦀','🐞','🦩'];
const PREFIX='aihero-race-v1-';
const PEERCFG={debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turn:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}]}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const show=id=>['landing','prof','host','student'].forEach(x=>$(x).classList.toggle('hidden',x!==id));
const params=new URLSearchParams(location.search);
let actx=null,muted=false;
function tone(f,d,type='square',v=.05,delay=0){if(muted)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sTick=()=>tone(880,.06,'square',.03),sGo=()=>[523,659,784].forEach((f,i)=>tone(f,.15,'triangle',.07,i*.1)),sWin=()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.22,'triangle',.08,i*.12)),sBad=()=>tone(150,.35,'sawtooth',.07),sRun=()=>{for(let i=0;i<10;i++)tone(200+i*40,.05,'square',.025,i*.12)};
function confetti(n=140){const c=$('conf');for(let i=0;i<n;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'vw';e.style.background=['#ffd23f','#ff4d6d','#2ee6a6','#4cc9f0','#9b5cff'][i%5];e.style.animationDuration=(2+Math.random()*2.5)+'s';e.style.animationDelay=Math.random()*1.2+'s';c.appendChild(e);setTimeout(()=>e.remove(),5500)}}

/* ================= HOST ================= */
let H=null;
function hostStart(){
 const code=String(Math.floor(10000+Math.random()*90000));
 H={code,phase:'lobby',qi:-1,stu:{},conns:{},deadline:0,ans:{},peer:null,letters:0,tick:null,algo:0};
 show('host');$('hCode').textContent=code;openHost();renderH();
 $('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊'};
 document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();const b=$('next');if(b)b.click()}});
}
function openHost(){
 if(typeof Peer==='undefined'){$('hInfo').textContent='연결 라이브러리를 못 불러왔어요 (인터넷 확인)';return}
 const p=new Peer(PREFIX+H.code,PEERCFG);H.peer=p;
 p.on('open',()=>{$('hInfo').textContent='학생 접속 대기 중';});
 p.on('connection',c=>{c.on('data',d=>onH(c,d));c.on('close',()=>{for(const k in H.conns)if(H.conns[k]===c){delete H.conns[k];if(H.stu[k])H.stu[k].on=false}if(H.phase==='lobby')renderH()})});
 p.on('error',e=>{if(e.type==='unavailable-id'){H.code=String(Math.floor(10000+Math.random()*90000));$('hCode').textContent=H.code;setTimeout(openHost,300)}else $('hInfo').textContent='연결 문제 · 다시 시도 중'});
 p.on('disconnected',()=>{try{p.reconnect()}catch(e){}});
}
function onH(c,d){
 if(!d||!d.sid)return;
 if(d.t==='join'){const name=String(d.name||'').slice(0,8)||'익명';const s=H.stu[d.sid]||{score:0,correct:0,streak:0,last:null,y:Math.random()};s.name=name;s.av=AV.includes(d.av)?d.av:'🙂';s.on=true;H.stu[d.sid]=s;H.conns[d.sid]=c;
  if(H.phase==='lobby'){tone(660+Math.random()*300,.1,'triangle',.05);renderH()}send(d.sid);return}
 if(d.t==='ans'&&H.phase==='q'&&d.qi===H.qi&&H.ans[d.sid]===undefined&&H.stu[d.sid]){
  const left=Math.max(0,H.deadline-Date.now());H.ans[d.sid]={c:+d.c,left};
  const el=$('acnt');if(el)el.textContent=Object.keys(H.ans).length;
  const on=Object.values(H.stu).filter(s=>s.on).length;if(Object.keys(H.ans).length>=on)reveal();
 }
}
function stateFor(sid){const s=H.stu[sid];const r=ranked();const q=QLIST[H.qi];
 return {t:'st',phase:H.phase,qi:H.qi,total:QLIST.length,q:H.phase==='q'&&q?{q:q.q,o:q.o,ox:!!q.ox,zone:ZONES[q.zi].short}:null,left:Math.max(0,H.deadline-Date.now()),
  me:s?{score:s.score,rank:r.findIndex(x=>x.sid===sid)+1,n:r.length,last:s.last,answered:H.ans[sid]!==undefined}:null,letters:H.letters}}
function send(sid){const c=H.conns[sid];if(c&&c.open)try{c.send(stateFor(sid))}catch(e){}}
function sendAll(){for(const k in H.conns)send(k)}
function ranked(){return Object.entries(H.stu).map(([sid,s])=>Object.assign({sid},s)).sort((a,b)=>b.score-a.score)}
function nextQ(){
 H.qi++;if(H.qi>=QLIST.length){H.phase='final';renderH();sendAll();return}
 H.phase='q';H.ans={};H.deadline=Date.now()+QT*1000;sGo();renderH();sendAll();
 clearInterval(H.tick);H.tick=setInterval(()=>{const l=Math.ceil((H.deadline-Date.now())/1000);const t=$('tmr');if(t){t.textContent=Math.max(0,l);t.classList.toggle('low',l<=5);if(l<=5&&l>0)sTick()}if(l<=0)reveal()},1000);
}
function reveal(){
 if(H.phase!=='q')return;clearInterval(H.tick);const q=QLIST[H.qi];
 for(const sid in H.stu){const s=H.stu[sid],a=H.ans[sid];
  if(a&&a.c===q.a){s.streak++;const pts=Math.round(500+500*a.left/(QT*1000))+(s.streak>=3?100*Math.min(5,s.streak-2):0);s.score+=pts;s.correct++;s.last={ok:true,pts,streak:s.streak}}
  else{s.streak=0;s.last={ok:false,pts:0,none:!a}}}
 H.phase='reveal';H.algo=(H.qi+1)/QLIST.length;renderH();sendAll();
 const ok=Object.values(H.ans).filter(a=>a.c===q.a).length;ok?sWin():sBad();
}
function toRace(){H.phase='race';renderH();sendAll();sRun();
 requestAnimationFrame(()=>requestAnimationFrame(()=>placeRunners(true)));
}
function afterRace(){const q=QLIST[H.qi];if(q.k===2){H.letters=q.zi+1;H.phase='zone';renderH();sendAll();sWin();confetti(60)}else nextQ()}
const MAXPTS=QLIST.length*1000;
function placeRunners(animate){
 const tw=$('track');if(!tw)return;const W=tw.clientWidth-90,Hh=tw.clientHeight;
 const r=ranked();const top=r.slice(0,3).map(s=>s.sid);
 r.forEach((s,i)=>{let el=document.getElementById('rn-'+s.sid);if(!el)return;
  const x=40+Math.min(1,s.score/MAXPTS*1.15)*(W-40);const y=60+s.y*(Hh-110);
  el.style.left=x+'px';el.style.top=y+'px';el.classList.toggle('top3',top.includes(s.sid));
  if(animate){if(s.last&&s.last.ok){el.classList.add('run');setTimeout(()=>el.classList.remove('run'),2400)}else{el.classList.add('trip');setTimeout(()=>el.classList.remove('trip'),700)}}});
 const al=$('algo');if(al)al.style.left=(40+H.algo*0.9*(W-40)*0.75)+'px';
}
function trackHTML(){
 const r=ranked();
 return `<div class="trackwrap" id="track"><div class="zones">${ZONES.map((z,i)=>`<div class="zseg"><span class="lab">${i+1}구역 ${esc(z.name)}</span><span class="lt ${i<H.letters?'on':''}">${i<H.letters?z.letter:'?'}</span></div>`).join('')}</div><div class="exit"><span>EXIT</span></div>
 <div class="algo" id="algo" style="left:${40}px"><div class="beam"></div><div class="bot"><div class="eye"></div></div><div class="say">${['거기 서라!','잡았다… 아깝네','도망쳐 봐야 소용없어!','크크크'][H.qi%4]}</div></div>
 ${r.map(s=>`<div class="runner" id="rn-${s.sid}" style="left:40px;top:50%"><span class="e">${esc(s.av)}</span><span class="n">${esc(s.name)}</span></div>`).join('')}</div>`;
}
function renderH(){
 const st=$('stage');const r=ranked();const n=r.length;
 $('hInfo').textContent=`참가 ${n}명`+(H.phase==='lobby'?' · 학생 접속 대기 중':` · 문제 ${Math.max(0,H.qi+1)}/${QLIST.length}`);
 if(H.phase==='lobby'){
  const url=location.origin+location.pathname+'?r='+H.code;let qr='';try{const q=qrcode(0,'M');q.addData(url);q.make();qr=q.createSvgTag({cellSize:6,margin:2,scalable:true})}catch(e){}
  st.innerHTML=`<div class="lobby"><div class="qrbox">${qr}<div class="c">${H.code}</div><div class="u">${esc(url)}</div></div>
  <div><h2 style="font-size:44px">ALGO가 연구소를 잠갔다! 🔒</h2><p class="sub">QR을 찍거나 주소로 들어와서 방 코드를 넣고, 캐릭터를 골라요. 맞힐수록 캐릭터가 출구를 향해 달려요. 뒤에서 ALGO가 쫓아와요!</p>
  <div class="crowd">${r.map(s=>`<div class="kid"><span class="e">${esc(s.av)}</span><span class="n">${esc(s.name)}</span></div>`).join('')||'<p class="sub">아직 아무도 없어요…</p>'}</div>
  <div style="margin-top:16px"><button class="btn big" id="next" ${n?'':'disabled style="opacity:.5"'}>레이스 시작! ▶</button></div></div></div>`;
  $('next').onclick=()=>{if(n)nextQ()};return}
 const q=QLIST[H.qi];
 if(H.phase==='q'){
  st.innerHTML=`<div class="qhead"><span class="zone-tag">${esc(ZONES[q.zi].short)} · ${esc(ZONES[q.zi].name)}</span><span class="sub">문제 ${H.qi+1} / ${QLIST.length}</span></div>
  <div class="qtext">${esc(q.q)}</div>
  <div class="qmid"><div class="timer" id="tmr">${QT}</div><div class="algoq">🤖 ALGO: "${['이건 절대 못 맞힐걸?','시간이 없다, 서둘러!','틀려라… 틀려라…','크크, 함정이 있지'][H.qi%4]}"</div><div class="answered"><b id="acnt">0</b>명 답함</div></div>
  <div class="opts">${q.o.map((o,i)=>`<div class="opt ${CL[i]}"><span class="sh">${SH[i]}</span><span>${esc(o)}</span></div>`).join('')}</div>
  <div class="bar"><span class="msg"></span><button class="btn ghost" id="next">바로 정답 공개</button></div>`;
  $('next').onclick=reveal;return}
 if(H.phase==='reveal'){
  const cnt=q.o.map((_,i)=>Object.values(H.ans).filter(a=>a.c===i).length);const ok=cnt[q.a];
  st.innerHTML=`<div class="qhead"><span class="zone-tag">${esc(ZONES[q.zi].short)}</span><span class="sub">정답 공개</span></div><div class="qtext">${esc(q.q)}</div>
  <div class="opts">${q.o.map((o,i)=>`<div class="opt ${CL[i]} ${i===q.a?'win':'dim'}"><span class="sh">${SH[i]}</span><span>${esc(o)}</span><span class="cnt">${cnt[i]}</span></div>`).join('')}</div>
  <div class="bar"><span class="msg">${ok}명 정답! ${ok>=n/2?'ALGO가 당황한다 😵':'ALGO가 웃는다 😈'}</span><button class="btn big" id="next">달려라! 🏃</button></div>`;
  $('next').onclick=toRace;return}
 if(H.phase==='race'){
  const top=r.slice(0,5);
  st.innerHTML=`${trackHTML()}<div class="bar"><div class="lead5">${top.map((s,i)=>`<div>${i+1}. ${esc(s.av)} ${esc(s.name)} ${s.score}${s.last&&s.last.streak>=3?' 🔥'+s.last.streak:''}</div>`).join('')}</div><span class="msg"></span><button class="btn big" id="next">${q.k===2?'구역 돌파! ▶':'다음 문제 ▶'}</button></div>`;
  $('next').onclick=afterRace;placeRunners(false);return}
 if(H.phase==='zone'){
  const z=ZONES[q.zi];
  st.innerHTML=`<div class="bigmsg"><div class="sub" style="font-size:28px">${esc(z.short)}</div><div class="t">${esc(z.name)} 문이 열렸다!</div>
  <div class="letters">${ZONES.map((zz,i)=>`<div class="letter ${i<H.letters?'':'empty'}">${i<H.letters?zz.letter:'?'}</div>`).join('')}</div>
  <p class="sub">비밀 글자 획득! ${H.letters<5?'다음 구역으로!':'글자 5개를 모두 모았다… 출구 암호는?'}</p><button class="btn big" id="next">${H.letters<5?'다음 구역 ▶':'출구로! ▶'}</button></div>`;
  $('next').onclick=()=>nextQ();return}
 if(H.phase==='final'){
  st.innerHTML=`<div class="bigmsg"><div class="t">출구 암호는?</div><div class="letters">${'HUMAN'.split('').map(l=>`<div class="letter">${l}</div>`).join('')}</div>
  <p class="sub" style="font-size:26px;max-width:900px">AI는 데이터로 배우지만, 데이터를 고르고 결과를 확인하고 책임지는 건 <b style="color:var(--y)">사람(HUMAN)</b>!</p><button class="btn big" id="next">🏆 탈출 순위 발표</button></div>`;
  $('next').onclick=()=>{H.phase='podium';renderH();sendAll();sWin();confetti(220)};return}
 if(H.phase==='podium'){
  const t=r.slice(0,3);const order=[t[1],t[0],t[2]],hs=[230,300,180],rk=[2,1,3],bg=['#c0c7d6','#ffd23f','#d08b4c'];
  st.innerHTML=`<div class="bigmsg"><div class="t" style="font-size:64px">탈출 성공! 🚪✨</div><div class="podium">${order.map((s,i)=>s?`<div class="pd" style="height:${hs[i]}px;background:${bg[i]};color:#1a1333"><span class="e">${esc(s.av)}</span><b>${esc(s.name)}</b><span>${s.score}점</span><span class="rk">${rk[i]}</span></div>`:'').join('')}</div>
  <div class="lead5" style="flex-wrap:wrap;justify-content:center;max-width:1100px">${r.slice(3,15).map((s,i)=>`<div>${i+4}. ${esc(s.av)} ${esc(s.name)} ${s.score}</div>`).join('')}</div>
  <button class="btn ghost" id="next">다시 하기</button></div>`;
  $('next').onclick=()=>{for(const k in H.stu){Object.assign(H.stu[k],{score:0,correct:0,streak:0,last:null})}H.qi=-1;H.letters=0;H.algo=0;H.phase='lobby';renderH();sendAll()};return}
}

/* ================= STUDENT ================= */
let S={code:'',sid:'',name:'',av:'',peer:null,conn:null,st:null,picked:null,deadline:0};
function studentProfile(code){
 S.code=code;try{S.sid=localStorage.getItem('aihero_race_sid')||Math.random().toString(36).slice(2,10);localStorage.setItem('aihero_race_sid',S.sid);const p=JSON.parse(localStorage.getItem('aihero_race_prof')||'null');if(p){S.name=p.name;S.av=p.av}}catch(e){S.sid=S.sid||Math.random().toString(36).slice(2,10)}
 S.av=S.av||AV[Math.floor(Math.random()*AV.length)];
 show('prof');$('avs').innerHTML=AV.map(a=>`<button class="av${a===S.av?' on':''}" data-a="${a}">${a}</button>`).join('');
 $('avs').querySelectorAll('.av').forEach(b=>b.onclick=()=>{S.av=b.dataset.a;$('avs').querySelectorAll('.av').forEach(x=>x.classList.toggle('on',x===b))});
 $('nameIn').value=S.name||'';
 $('joinGo').onclick=()=>{const v=$('nameIn').value.trim();if(!v){$('pmsg').textContent='별명을 써 주세요';return}S.name=v;try{localStorage.setItem('aihero_race_prof',JSON.stringify({name:S.name,av:S.av}))}catch(e){}
  show('student');$('sAv').textContent=S.av;$('sNm').textContent=S.name;renderS();connectS()};
}
function connectS(){
 if(typeof Peer==='undefined'){$('sStatus').textContent='연결 라이브러리를 못 불러왔어요';return}
 if(!S.peer||S.peer.destroyed){S.peer=new Peer(undefined,PEERCFG);S.peer.on('open',dial);
  S.peer.on('error',e=>{$('sStatus').textContent=e.type==='peer-unavailable'?'방을 찾을 수 없어요 · 코드 확인 후 다시 연결 중':'연결 문제 · 다시 시도 중';setTimeout(dial,3000)});
  S.peer.on('disconnected',()=>{try{S.peer.reconnect()}catch(e){}})}else dial();
}
function dial(){if(!S.peer||S.peer.destroyed||S.peer.disconnected)return;const c=S.peer.connect(PREFIX+S.code,{reliable:true});S.conn=c;
 c.on('open',()=>{$('sStatus').textContent='연결됨 · 방 '+S.code;c.send({t:'join',sid:S.sid,name:S.name,av:S.av})});
 c.on('data',d=>{if(d&&d.t==='st'){const prevQ=S.st&&S.st.qi;S.st=d;if(d.qi!==prevQ)S.picked=null;S.deadline=Date.now()+(d.left||0);renderS()}});
 c.on('close',()=>{$('sStatus').textContent='연결 끊김 · 다시 연결 중';setTimeout(dial,2000)});
}
let sTimer=null;
function renderS(){
 const b=$('sBody'),d=S.st;if(d&&d.me)$('sSc').textContent=d.me.score;
 clearInterval(sTimer);
 if(!d||d.phase==='lobby'){b.innerHTML=`<div class="swait"><span class="e">${esc(S.av)}</span><div class="t">입장 완료!</div><p class="sub">선생님 화면에 내 캐릭터가 보이나요?<br>레이스 시작을 기다려요</p></div>`;return}
 if(d.phase==='q'){
  if(S.picked!==null||(d.me&&d.me.answered)){b.innerHTML=`<div class="swait"><span class="e">🏃</span><div class="t">제출 완료!</div><p class="sub">다른 친구들을 기다려요…</p></div>`;return}
  b.innerHTML=`<div class="sq"><small style="color:#7a6fb0">${esc(d.q.zone)} · ⏱ <span id="sT">${Math.ceil(d.left/1000)}</span>초</small><br>${esc(d.q.q)}</div>
  <div class="sopts" style="${d.q.o.length===2?'grid-template-columns:1fr 1fr':''}">${d.q.o.map((o,i)=>`<button class="sopt" data-i="${i}" style="background:${CLS[i]}"><span class="sh">${SH[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
  b.querySelectorAll('.sopt').forEach(x=>x.onclick=()=>{if(S.picked!==null)return;S.picked=+x.dataset.i;try{S.conn.send({t:'ans',sid:S.sid,qi:d.qi,c:S.picked})}catch(e){}tone(700,.08,'triangle');renderS()});
  sTimer=setInterval(()=>{const t=$('sT');if(t)t.textContent=Math.max(0,Math.ceil((S.deadline-Date.now())/1000))},500);return}
 const me=d.me||{};const l=me.last;
 if(d.phase==='reveal'||d.phase==='race'){
  if(l&&l.ok)b.innerHTML=`<div class="swait ok"><span class="e">${esc(S.av)}</span><div class="t">정답! +${l.pts}</div><p class="sub">${l.streak>=3?'🔥 '+l.streak+'연속 정답 콤보!<br>':''}내 캐릭터가 출구로 달려요! · 지금 ${me.rank}등 / ${me.n}명</p></div>`;
  else b.innerHTML=`<div class="swait no"><span class="e">😵</span><div class="t">${l&&l.none?'시간 초과!':'아쉽다!'}</div><p class="sub">ALGO가 따라온다… 다음 문제에서 만회!<br>지금 ${me.rank}등 / ${me.n}명</p></div>`;
  return}
 if(d.phase==='zone'){b.innerHTML=`<div class="swait ok"><span class="e">🚪</span><div class="t">${d.letters}구역 돌파!</div><p class="sub">비밀 글자를 모으는 중 · 지금 ${me.rank}등</p></div>`;return}
 if(d.phase==='final'){b.innerHTML=`<div class="swait"><span class="e">🔐</span><div class="t">출구 암호는?</div><p class="sub">선생님 화면을 보세요!</p></div>`;return}
 if(d.phase==='podium'){b.innerHTML=`<div class="swait ok"><span class="e">${me.rank<=3?['🥇','🥈','🥉'][me.rank-1]:esc(S.av)}</span><div class="t">탈출 성공!</div><p class="sub">최종 ${me.rank}등 / ${me.n}명 · ${me.score}점</p></div>`;if(me.rank<=3)confetti(80);return}
}

/* ================= 시작 ================= */
$('toHost').onclick=hostStart;
$('toJoin').onclick=()=>{const c=$('codeIn').value.replace(/\D/g,'');if(c.length!==5){$('codeIn').focus();return}studentProfile(c)};
$('codeIn').onkeydown=e=>{if(e.key==='Enter')$('toJoin').click()};
if(params.has('host'))hostStart();
else if(params.get('r'))studentProfile(params.get('r').replace(/\D/g,'').slice(0,5));
window.addEventListener('resize',()=>{if(H&&H.phase==='race')placeRunners(false)});
</script>
</body>
</html>
