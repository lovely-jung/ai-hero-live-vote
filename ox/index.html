<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AI일까, 아닐까?</title>
<meta name="description" content="노을 지는 교실에서 O와 X로 갈라서는 실시간 OX 퀴즈">
<meta name="theme-color" content="#1a1220">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Gaegu:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --night:#1a1220; --glass:rgba(22,16,28,.58); --glass2:rgba(255,255,255,.08); --edge:rgba(255,255,255,.14);
  --text:#fff6ec; --dim:rgba(255,246,236,.66); --sun:#f7a531; --sun2:#ffcf7a;
  --o:#5aa2ff; --x:#ff6a5c; --good:#4fd18b;
  --ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --chalk:"Gaegu","IBM Plex Sans KR",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--text);font-family:var(--ui);-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;color:inherit}
:focus-visible{outline:2px solid var(--sun2);outline-offset:3px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none!important}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);border:1px solid var(--edge);box-shadow:0 18px 50px rgba(0,0,0,.35)}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 26px;font-weight:700;font-size:17px;transition:transform .15s,background .2s}
.pill:hover:not(:disabled){transform:translateY(-1px)}
.pill.sun{background:var(--sun);color:#2a1606;box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 8px 30px rgba(247,165,49,.45)}
.pill.ghost{background:var(--glass2);border:1px solid var(--edge)}
.pill.small{padding:9px 16px;font-size:15px;font-weight:600}
.pill:disabled{opacity:.5;cursor:default}

/* 시작 */
.screen{position:fixed;inset:0;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left));overflow:auto;background:radial-gradient(ellipse at 50% 50%,rgba(20,12,24,.62) 0,rgba(20,12,24,.35) 45%,rgba(20,12,24,.7) 100%)}
.hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:440px}
.sunDot{width:14px;height:14px;border-radius:50%;background:var(--sun);box-shadow:0 0 24px 8px rgba(247,165,49,.6)}
.hero h1{margin:0;font-size:clamp(38px,9vw,56px);font-weight:700;letter-spacing:-.02em;line-height:1.1;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.hero h1 b{color:var(--o)} .hero h1 i{font-style:normal;color:var(--x)}
.hero p{margin:0;color:var(--dim);font-size:16px;line-height:1.6;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.hero .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.hero small{color:var(--dim);font-size:13px}
.linkbtn{background:none;color:var(--dim);text-decoration:underline;text-underline-offset:3px;font-size:14px;padding:6px}

.card{border-radius:24px;padding:26px clamp(18px,5vw,30px);width:min(420px,100%);display:flex;flex-direction:column;gap:14px}
.card h2{margin:0;font-size:26px}
label{font-size:13px;color:var(--dim);display:block;margin-bottom:6px}
input[type=text],input[type=tel]{width:100%;font:inherit;font-size:19px;padding:12px 16px;border:1px solid var(--edge);border-radius:14px;background:rgba(0,0,0,.25);color:var(--text)}
input::placeholder{color:rgba(255,246,236,.35)}
#code{letter-spacing:.3em;text-align:center;font-size:30px;font-weight:700}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 2px rgba(0,0,0,.25) inset}
.sw[aria-pressed=true]{border-color:#fff;transform:scale(1.08)}
.err{color:#ffb0a8;font-size:14px;min-height:1.2em}

/* HUD */
.hud{position:fixed;z-index:5}
#tbar{left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:8px;border-radius:999px;max-width:calc(100% - 24px)}
#codeTag{right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));border-radius:999px;padding:8px 18px;display:flex;gap:12px;align-items:baseline;font-size:14px;color:var(--dim)}
#codeTag b{font-size:24px;letter-spacing:.14em;color:var(--sun2)}
#codeTag span{color:var(--text);font-weight:600}
#lobby{right:max(16px,env(safe-area-inset-right));top:66px;border-radius:24px;padding:20px;width:min(320px,calc(100% - 32px));display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
#lobby h3{margin:0;font-size:18px}
#qr{background:#fff;padding:10px;border-radius:14px;line-height:0}
#qr img,#qr canvas{width:184px!important;height:184px!important}
#bigCode{font-size:50px;font-weight:700;letter-spacing:.16em;color:var(--sun2);line-height:1;text-shadow:0 0 30px rgba(247,165,49,.4)}
#joinUrl{font-size:12px;color:var(--dim);word-break:break-all}
#editor{left:max(16px,env(safe-area-inset-left));top:66px;border-radius:24px;padding:18px;width:min(540px,calc(100% - 32px));max-height:calc(100% - 170px);display:flex;flex-direction:column;gap:8px}
#editor h3{margin:0;font-size:18px}
#editor small{color:var(--dim);font-size:13px}
#editor textarea{width:100%;min-height:200px;flex:1;font:inherit;font-size:14px;line-height:1.65;padding:12px;border:1px solid var(--edge);border-radius:14px;background:rgba(0,0,0,.28);color:var(--text);resize:vertical}
#status{left:50%;transform:translateX(-50%);top:max(10px,env(safe-area-inset-top));border-radius:999px;padding:9px 20px;font-weight:700;font-size:clamp(14px,3.8vw,18px);white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
#status.good{background:rgba(40,150,90,.75)} #status.bad{background:rgba(190,60,50,.75)}
#qcard{left:50%;transform:translateX(-50%);top:56px;border-radius:18px;padding:10px 18px;font-size:clamp(17px,4.4vw,24px);font-weight:700;line-height:1.4;text-align:center;width:min(640px,calc(100% - 24px))}
#qcard em{font-style:normal;color:var(--sun2);font-weight:700;margin-right:6px}
#help{left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));border-radius:999px;padding:7px 16px;font-size:13px;color:var(--dim);white-space:nowrap}
#rank{inset:0;display:grid;place-items:center;background:rgba(10,6,14,.5);padding:20px}
#rank .card{width:min(500px,100%);max-height:100%;overflow:auto}
#rank ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
#rank li{display:grid;grid-template-columns:40px 22px 1fr auto;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;background:rgba(255,255,255,.06);font-size:17px}
#rank li.me{box-shadow:0 0 0 2px var(--sun) inset}
#rank .pos{font-weight:700;font-size:20px;text-align:center;color:var(--sun2)}
#rank .dot{width:18px;height:18px;border-radius:50%}
#rank .sc{font-weight:700;font-variant-numeric:tabular-nums}
#toast{left:50%;top:50%;transform:translate(-50%,-50%);border-radius:22px;padding:22px 26px;text-align:center;max-width:min(420px,90%)}
#toast b{display:block;font-size:20px;margin-bottom:6px}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(12,6,14,.55) 100%)}
#qbig{left:50%;transform:translateX(-50%);top:max(16px,env(safe-area-inset-top));width:min(1100px,calc(100% - 32px));border-radius:26px;padding:18px 28px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
#qbig .meta{display:flex;gap:12px;align-items:center;font-size:clamp(14px,1.4vw,20px);color:var(--dim);font-weight:600}
#qbig .meta b{color:var(--sun2)}
#qbig .timer{font-variant-numeric:tabular-nums;background:rgba(255,255,255,.1);border-radius:999px;padding:2px 14px;color:var(--text)}
#qbig .timer.hot{background:rgba(255,106,92,.85)}
#qbig .q{font-size:clamp(24px,3.3vw,54px);font-weight:700;line-height:1.3;text-wrap:balance;text-shadow:0 2px 20px rgba(0,0,0,.4)}
#qbig .ans{font-size:clamp(20px,2.4vw,38px);font-weight:700}
#qbig .ans.o{color:var(--o)} #qbig .ans.x{color:var(--x)}
#qbig .exp{font-size:clamp(15px,1.6vw,24px);color:#d8f3dc}
#chatbar{left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 44px);width:min(480px,calc(100% - 24px));border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:6px}
#chatbar form{display:flex;gap:6px}
#chatbar input{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 12px;border-radius:12px;border:1px solid var(--edge);background:rgba(0,0,0,.3);color:var(--text)}
#chatbar .quick{display:flex;gap:6px;flex-wrap:wrap}
#chatbar .quick button{font:inherit;font-size:15px;padding:4px 10px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.08);color:var(--text);cursor:pointer}
#chatbar .send{font:inherit;font-weight:700;padding:0 14px;border-radius:12px;border:0;background:var(--sun);color:#2a1606;cursor:pointer}
#chatbar .send:disabled{opacity:.5}
#chatmini{font-size:12px;color:var(--dim);padding:0 4px}
#chatlog{left:max(14px,env(safe-area-inset-left));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 70px);width:min(320px,40vw);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;font-size:15px;line-height:1.35;pointer-events:none}
#chatlog h3{margin:0 0 2px;font-size:13px;color:var(--dim);font-weight:600}
#chatlog div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chatlog b{font-weight:700;margin-right:6px}
#zoneTag{right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));border-radius:18px;padding:8px 16px;font-weight:700;font-size:18px}
body.chaton #zoneTag{bottom:calc(max(12px,env(safe-area-inset-bottom)) + 150px)}
#zoneTag.o{background:rgba(60,120,230,.8)} #zoneTag.x{background:rgba(220,80,70,.8)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="vignette"></div>

<section class="screen" id="home">
  <div class="hero">
    <div class="sunDot"></div>
    <h1>AI일까, 아닐까?</h1>
    <p>노을 지는 교실, 칠판에 문제가 떠요.<br>내 아바타를 <b style="color:var(--o)">O</b> 쪽이나 <b style="color:var(--x)">X</b> 쪽으로 데려가세요.</p>
    <div class="row">
      <button class="pill sun" id="goStudent">학생으로 입장</button>
      <button class="pill ghost" id="goTeacher">선생님: 교실 열기</button>
    </div>
    <button class="linkbtn" id="goDemo">가상 학생 25명으로 미리보기</button>
    <small>소리가 나와요 · 선생님 화면에서 음악을 켤 수 있어요</small>
  </div>
</section>

<section class="screen" id="join" hidden>
  <form class="card glass" id="joinForm" autocomplete="off">
    <h2>교실 입장</h2>
    <div><label for="code">입장 코드 (칠판 화면의 숫자 4자리)</label>
      <input type="tel" id="code" inputmode="numeric" maxlength="4" placeholder="0000"></div>
    <div><label for="nick">이름</label>
      <input type="text" id="nick" maxlength="8" placeholder="예: 김민준"></div>
    <div><label>내 아바타 색</label><div class="swatches" id="sws"></div></div>
    <div class="err" id="joinErr"></div>
    <button class="pill sun" id="joinBtn" type="submit">입장하기</button>
  </form>
</section>

<div class="hud glass" id="codeTag" hidden>입장 코드 <b id="codeSmall">----</b><span id="cnt">0명</span></div>
<div class="hud glass" id="lobby" hidden>
  <h3>폰으로 QR을 찍고 들어오세요</h3>
  <div id="qr"></div>
  <div style="color:var(--dim);font-size:13px">또는 입장 코드</div>
  <div id="bigCode">----</div>
  <div id="joinUrl"></div>
</div>
<div class="hud glass" id="editor" hidden>
  <h3>문제 편집</h3>
  <small>한 줄에 한 문제 · <b>문장 | O 또는 X | 해설(선택)</b></small>
  <textarea id="qtext" spellcheck="false" aria-label="문제 목록"></textarea>
  <small id="qcount"></small>
</div>
<div class="hud glass" id="tbar" hidden></div>
<div class="hud glass" id="qbig" hidden></div>
<div class="hud glass" id="zoneTag" hidden></div>
<div class="hud glass" id="chatbar" hidden>
  <div class="quick" id="quick"></div>
  <form id="chatForm" autocomplete="off"><input id="chatIn" maxlength="30" placeholder="한마디 (30자, 바른 말로!)" aria-label="채팅 입력"><button class="send" id="chatSend" type="submit">보내기</button></form>
  <div id="chatmini"></div>
</div>
<div class="hud glass" id="chatlog" hidden><h3>💬 교실 채팅</h3></div>

<div class="hud glass" id="status" hidden></div>
<div class="hud glass" id="qcard" hidden></div>
<div class="hud glass" id="help" hidden>화면을 누르거나 방향키로 이동</div>

<div class="hud" id="rank" hidden><div class="card glass"><h2>최종 순위</h2><ol id="rankList"></ol><div id="rankBtns"></div></div></div>
<div class="hud glass" id="toast" hidden></div>

<script>
/* ================= 설정 ================= */
const DEFAULT_Q = `넷플릭스가 내가 본 영상을 보고 콘텐츠를 추천해 주는 것은 AI다. | O | 시청 기록 데이터를 배워 취향을 예측해요. (예측)
사람이 다가가면 저절로 열리는 자동문은 AI다. | X | 센서에 감지되면 연다는 정해진 규칙대로만 움직여요.
스마트폰이 내 얼굴을 알아보고 잠금을 푸는 얼굴 인식은 AI다. | O | 얼굴 데이터를 배워 각도·조명이 달라도 알아봐요. (시각)
정해진 시간마다 색이 바뀌는 시간제 신호등은 AI다. | X | 미리 입력된 시간표대로만 바뀌어요.
한국어 문장을 영어로 바꿔 주는 번역기는 AI다. | O | 엄청난 양의 번역 문장을 배웠어요. (언어)
정한 시간이 지나면 멈추는 전자레인지 타이머는 AI다. | X | 맞춰 둔 시간대로만 작동해요.
"오늘 날씨 알려 줘"를 알아듣는 AI 스피커는 AI다. | O | 여러 사람의 목소리를 배워 말을 알아듣고 답해요. (청각 + 언어)
내비게이션이 알려 주는 도착 예상 시간은 AI다. | O | 수많은 차들의 이동 기록을 배워 걸릴 시간을 예측해요. (예측)
스팸 메일을 자동으로 걸러 주는 메일 분류는 AI다. | O | 스팸과 정상 메일 예시를 배워 새 메일을 판단해요. (언어)
영상 속 말소리를 자막으로 바꿔 주는 유튜브 자동 자막은 AI다. | O | 음성 데이터를 배워 소리를 글자로 바꿔요. (청각)`;
const COLORS=["#ff6b6b","#ffa94d","#ffd43b","#69db7c","#38d9a9","#4dabf7","#9775fa","#f783ac","#c08457","#adb5bd"];
const PREFIX="aiox-class-v1-";
const TOP="aiox-classroom-v2/";
const BROKERS=(()=>{ const b=new URLSearchParams(location.search).get("broker"); if(b) return [{url:b}];
  return [{url:"wss://broker.emqx.io:8084/mqtt"},{url:"wss://broker.hivemq.com:8884/mqtt"},{url:"wss://public.cloud.shiftr.io",username:"public",password:"public"}]; })();
const rid=()=>Math.random().toString(36).slice(2,10);
// 여러 중계 서버에 동시에 연결: 학교망이 일부를 막아도 하나만 통하면 됨
/* QR: 1) qrcodejs  2) qrcode-generator 재시도  3) 이미지 서비스 — 어느 하나라도 되면 표시 */
function loadScript(src){return new Promise((ok,no)=>{const sc=document.createElement("script");sc.src=src;sc.onload=ok;sc.onerror=no;document.head.appendChild(sc);setTimeout(no,6000)})}
async function makeQR(el,url){
  el.innerHTML="";
  try{ if(window.QRCode){ new QRCode(el,{text:url,width:400,height:400,correctLevel:QRCode.CorrectLevel.M}); if(el.firstChild) return; } }catch(e){}
  try{ if(!window.qrcode) await loadScript("https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js");
    const q=qrcode(0,"M"); q.addData(url); q.make(); el.innerHTML=q.createSvgTag({cellSize:8,margin:2,scalable:true}); const sv=el.querySelector("svg"); if(sv){sv.style.width="184px";sv.style.height="184px"} return; }catch(e){}
  const im=new Image(); im.alt="입장 QR"; im.src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=8&data="+encodeURIComponent(url);
  im.onerror=()=>{ el.innerHTML='<div style="color:#333;font-size:14px;line-height:1.4;padding:20px 6px;width:184px">QR을 못 만들었어요.<br>아래 입장 코드로 들어오세요</div>'; };
  el.appendChild(im);
}
function relayConnect(topics,onMsg,onUp){
  return BROKERS.map(b=>{ let c; try{ c=mqtt.connect(b.url,{username:b.username,password:b.password,clientId:"ox_"+rid(),reconnectPeriod:2500,connectTimeout:9000,keepalive:30,clean:true}); }catch(e){ return null; }
    c.on("connect",()=>{ topics().forEach(t=>c.subscribe(t,{qos:0})); onUp&&onUp(c); });
    c.on("message",(t,m)=>{ let d; try{ d=JSON.parse(m.toString()); }catch(e){ return; } onMsg(t,d,c); });
    c.on("error",()=>{}); return c; }).filter(Boolean);
}
function relayPub(clients,topic,obj){ const m=JSON.stringify(obj); for(const c of clients){ if(c&&c.connected){ try{ c.publish(topic,m,{qos:0}); }catch(e){} } } }

/* 게임 좌표 (2D, 서버 기준) */
const BX={x0:30,x1:970,y0:212,y1:622};
const ZO={x:36,y:236,w:404,h:380}, ZX={x:560,y:236,w:404,h:380};
const SPEED=280;

    c.fillStyle="rgba(255,255,255,.96)"; c.beginPath(); c.roundRect?c.roundRect(x,y,tw,th,28):c.rect(x,y,tw,th); c.fill();
    c.beginPath(); c.moveTo(w/2-16,y+th-1); c.lineTo(w/2,h-4); c.lineTo(w/2+16,y+th-1); c.fill();
    c.fillStyle="#2a1b24"; c.textAlign="center"; c.textBaseline="middle"; lines.forEach((l,k)=>c.fillText(l,w/2,y+17+27+k*54)); });
  bubCache.set(text,t); return t; }
function btn(label,fn,cls="ghost"){ const b=document.createElement("button"); b.className="pill small "+cls; b.textContent=label; b.onclick=fn; return b; }
function buildTbar(){
  if(mode!=="host") return;
  const bar=$("tbar"); bar.innerHTML=""; const ph=host.st.ph;
  if(ph==="lobby"){
    bar.append(btn("퀴즈 시작",startQuiz,"sun"));
    const sel=document.createElement("select"); sel.className="pill small ghost"; sel.setAttribute("aria-label","문제당 시간"); sel.style.appearance="none";
    [10,15,20,30].forEach(s=>{const o=document.createElement("option");o.value=s*1000;o.textContent=`문제당 ${s}초`;o.style.color="#000";if(s*1000===host.T)o.selected=true;sel.append(o)});
    sel.onchange=()=>host.T=+sel.value; bar.append(sel,
      btn("문제 편집",()=>{$("editor").hidden=!$("editor").hidden}), btn("QR",()=>{$("lobby").hidden=!$("lobby").hidden}));
  } else if(ph==="q"){ bar.append(btn("정답 바로 공개",reveal,"sun"),btn("+5초",()=>{host.deadline+=5000;host.st.T+=5000;}));
  } else if(ph==="reveal"){ bar.append(btn(host.st.qi+1<host.Q.length?"다음 문제":"최종 순위 보기",next,"sun"),btn("QR",()=>{$("lobby").hidden=!$("lobby").hidden}));
  } else if(ph==="end"){ bar.append(btn("처음으로",backToLobby,"sun")); }
  bar.append(btn(host.chatOn?"💬 채팅 켜짐":"💬 채팅 꺼짐",()=>{ host.chatOn=!host.chatOn; if(!host.chatOn) for(const p of host.players.values()) p.say=""; $("chatlog").hidden=!host.chatOn; buildTbar(); },host.chatOn?"ghost":"ghost"));
  bar.append(btn(Music.on?"♪ 음악 끄기":"♪ 음악 켜기",musicToggle,Music.on?"ghost":"ghost"));
}
function showRank(arr,isHost){
  arr.sort((a,b)=>b.s-a.s); const ol=$("rankList"); ol.innerHTML=""; let prev=null,pos=0;
  arr.forEach((p,i)=>{ if(p.s!==prev){pos=i+1;prev=p.s}
    const li=document.createElement("li"); if(p.me) li.className="me";
    const a=document.createElement("span");a.className="pos";a.textContent=pos;
    const d=document.createElement("span");d.className="dot";d.style.background=p.c;
    const n=document.createElement("span");n.textContent=p.n;
    const s=document.createElement("span");s.className="sc";s.textContent=p.s+"점";
    li.append(a,d,n,s); ol.append(li); });
  if(!arr.length){ const li=document.createElement("li"); li.textContent="참가한 학생이 없어요"; ol.append(li); }
  const rb=$("rankBtns"); rb.innerHTML=""; if(isHost){ const b=btn("처음으로",backToLobby,"sun"); b.style.marginTop="12px"; rb.append(b); }
  $("rank").hidden=false;
}
const BOTN=["민준","서연","도윤","하윤","시우","지우","주원","서아","예준","하은","지호","수아","준우","지유","현우","윤서","건우","채원","우진","지민","선우","다은","연우","예린","유준"];
function addBots(n){ for(let i=0;i<n;i++){ const id="bot"+i; host.players.set(id,{id,n:BOTN[i%BOTN.length],c:COLORS[i%COLORS.length],x:120+Math.random()*760,y:300+Math.random()*300,s:0,ph:Math.random()*6,bot:true,tgt:null,wait:Math.random()*3}); } }
const BOTSAY=["O 같은데?","X 아니야?","ㅋㅋㅋ","헷갈려 😮","이거 AI 맞지","👍","정답 뭐야","🔥🔥"];
function botStep(p,dt){ const st=host.st; if(host.chatOn&&Math.random()<dt*.02){ p.say=BOTSAY[Math.floor(Math.random()*BOTSAY.length)]; p.sayT=Date.now(); addChatLog(p.n,p.c,p.say); } if(st.ph==="reveal") return;
  if(st.ph==="q"){ if(!p.tgt){ p.wait-=dt; if(p.wait>0) return; const go=Math.random()<.7?st.a:(st.a==="O"?"X":"O"), R=go==="O"?ZO:ZX;
      p.tgt={x:R.x+40+Math.random()*(R.w-80),y:R.y+60+Math.random()*(R.h-100)}; } }
  else if(!p.tgt||Math.random()<.004){ p.tgt={x:BX.x0+60+Math.random()*(BX.x1-BX.x0-120),y:BX.y0+60+Math.random()*(BX.y1-BX.y0-80)}; }
  if(p.tgt){ const dx=p.tgt.x-p.x, dy=p.tgt.y-p.y, d=Math.hypot(dx,dy); if(d<4){ if(st.ph!=="q") p.tgt=null; return; }
    const v=Math.min(d,SPEED*.6*dt); p.x+=dx/d*v; p.y+=dy/d*v; } }

/* ================= 학생 ================= */
const stu={cli:null,clients:null,id:null,me:{x:500,y:500},tgt:null,keys:{},st:{ph:"lobby",P:[]},ps:new Map(),lastSent:"",color:COLORS[5]};
function setupJoin(){
  show("join"); const sws=$("sws"); sws.innerHTML="";
  COLORS.forEach((c,i)=>{ const b=document.createElement("button"); b.type="button"; b.className="sw"; b.style.background=c; b.setAttribute("aria-label",`색 ${i+1}`); b.setAttribute("aria-pressed",String(c===stu.color));
    b.onclick=()=>{stu.color=c;[...sws.children].forEach(x=>x.setAttribute("aria-pressed",String(x===b)))}; sws.append(b); });
  const room=new URLSearchParams(location.search).get("room"); if(room) $("code").value=room.replace(/\D/g,"").slice(0,4);
  try{ const n=localStorage.getItem("aiox-name"); if(n) $("nick").value=n; }catch(e){}
  ($("code").value?$("nick"):$("code")).focus();
  $("joinForm").onsubmit=e=>{ e.preventDefault(); joinRoom(); };
}
function joinRoom(){
  const code=$("code").value.replace(/\D/g,""), n=$("nick").value.trim(), err=$("joinErr"); err.textContent="";
  if(code.length!==4){ err.textContent="입장 코드 4자리를 입력해 주세요."; return; }
  if(!n){ err.textContent="이름을 입력해 주세요."; return; }
  try{ localStorage.setItem("aiox-name",n); }catch(e){}
  $("joinBtn").disabled=true; $("joinBtn").textContent="교실 찾는 중…";
  stu.id="s"+rid(); stu.code=code; stu.n=n; stu.lastMsg=0;
  const hello=c=>c.publish(TOP+code+"/c",JSON.stringify({t:"join",id:stu.id,n,c:stu.color}));
  let found=false;
  const clients=relayConnect(()=>[TOP+code+"/s"],(t,d,c)=>{
    if(!found){ found=true; stu.cli=c; for(const o of clients) if(o!==c){ try{o.end(true)}catch(e){} } clearTimeout(to); enterGame(); }
    if(c!==stu.cli) return; stu.lastMsg=Date.now(); onHostData(d);
  },c=>hello(c));
  stu.clients=clients;
  const to=setTimeout(()=>{ if(found) return; for(const o of clients){ try{o.end(true)}catch(e){} }
    err.textContent="교실을 찾지 못했어요. 선생님 화면의 숫자를 확인하고, 선생님 화면이 켜져 있는지 확인하세요."; $("joinBtn").disabled=false; $("joinBtn").textContent="입장하기"; },12000);
  // 내 이름이 교실에 보일 때까지 입장 신호 반복
  stu.joinTimer=setInterval(()=>{ const inRoom=stu.ps.has(stu.id); if(inRoom) return; for(const c of (found?[stu.cli]:clients)) if(c.connected) hello(c); },1200);
  // 연결 끊김 표시
  setInterval(()=>{ if(!found) return; const lost=Date.now()-stu.lastMsg>6000;
    if(lost&&!stu.lostShown){ stu.lostShown=true; toast("연결이 잠시 끊겼어요","다시 연결하는 중이에요. 선생님 화면이 켜져 있는지 확인하세요."); }
    if(!lost&&stu.lostShown){ stu.lostShown=false; $("toast").hidden=true; } },1000);
}
function enterGame(){
  mode="student"; $("join").hidden=true; $("status").hidden=false; $("help").hidden=false; setupChat();
  const hint=()=>{$("help").textContent=innerHeight>innerWidth?"폰을 가로로 돌리면 더 크게 보여요 · 바닥을 눌러 이동":"바닥을 누르거나 방향키로 이동"}; hint(); addEventListener("resize",hint);
  addEventListener("keydown",e=>{ stu.keys[e.key]=true; if(e.key.startsWith("Arrow")) e.preventDefault(); stu.tgt=null; });
  addEventListener("keyup",e=>{ stu.keys[e.key]=false; });
  let down=false;
  cv.addEventListener("pointerdown",e=>{ down=true; const w=pickFloor(e); if(w) stu.tgt=w; });
  cv.addEventListener("pointermove",e=>{ if(!down) return; const w=pickFloor(e); if(w) stu.tgt=w; });
  addEventListener("pointerup",()=>down=false);
  let hb=0; setInterval(()=>{ const c=stu.cli; if(!c||!c.connected) return; const k=Math.round(stu.me.x)+","+Math.round(stu.me.y); hb++;
    if(k!==stu.lastSent){ stu.lastSent=k; c.publish(TOP+stu.code+"/c",JSON.stringify({t:"pos",id:stu.id,x:Math.round(stu.me.x),y:Math.round(stu.me.y)})); }
    else if(hb%30===0) c.publish(TOP+stu.code+"/c",JSON.stringify({t:"hb",id:stu.id})); },100);
  let last=performance.now();
  (function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; stuStep(dt);
    frame3D(stu.st,[...stu.ps.values()],stu.id,now,dt,false); requestAnimationFrame(loop); })(last);
}
function setupChat(){
  const q=$("quick"); ["👍","😂","😮","🔥","O 같아!","X 같아!"].forEach(t=>{ const b=document.createElement("button"); b.type="button"; b.textContent=t; b.onclick=()=>sendChat(t); q.append(b); });
  $("chatForm").onsubmit=e=>{ e.preventDefault(); const v=$("chatIn").value; if(sendChat(v)) $("chatIn").value=""; $("chatIn").blur(); };
  $("chatIn").addEventListener("keydown",e=>e.stopPropagation()); $("chatIn").addEventListener("keyup",e=>e.stopPropagation());
}
function sendChat(m){ m=cleanChat(m); const c=stu.cli; if(!m||!c||!c.connected) return false; const now=Date.now();
  if(now-(stu.lastChat||0)<2000){ $("chatmini").textContent="잠깐! 2초 뒤에 다시 보낼 수 있어요"; return false; }
  stu.lastChat=now; c.publish(TOP+stu.code+"/c",JSON.stringify({t:"chat",id:stu.id,m})); $("chatmini").textContent=""; 
  const sb=$("chatSend"); sb.disabled=true; setTimeout(()=>sb.disabled=false,2000); return true; }
function stuStep(dt){
  const locked=stu.st.ph==="reveal"||stu.st.ph==="end", me=stu.me, k=stu.keys; let vx=0,vy=0;
  if(!locked){
    if(k.ArrowLeft||k.a||k.A) vx-=1; if(k.ArrowRight||k.d||k.D) vx+=1; if(k.ArrowUp||k.w||k.W) vy-=1; if(k.ArrowDown||k.s||k.S) vy+=1;
    if(vx||vy){ const d=Math.hypot(vx,vy); me.x+=vx/d*SPEED*dt; me.y+=vy/d*SPEED*dt; }
    else if(stu.tgt){ const dx=stu.tgt.x-me.x, dy=stu.tgt.y-me.y, d=Math.hypot(dx,dy); if(d<3) stu.tgt=null; else { const v=Math.min(d,SPEED*dt); me.x+=dx/d*v; me.y+=dy/d*v; } }
    me.x=clamp(me.x,BX.x0,BX.x1); me.y=clamp(me.y,BX.y0,BX.y1);
  }
  const z=zoneOf(me.x,me.y)||"-"; if(z!==stu.zoneShown){ stu.zoneShown=z; const zt=$("zoneTag"); zt.hidden=false; zt.className="hud glass"+(z==="O"?" o":z==="X"?" x":""); zt.textContent=z==="-"?"아직 구역 밖":`지금 ${z} 구역`; }
  for(const p of stu.ps.values()){ if(p.id===stu.id){ p.x=me.x; p.y=me.y; } else { const f=Math.min(1,dt*12); p.x+=(p.tx-p.x)*f; p.y+=(p.ty-p.y)*f; } }
}
function onHostData(d){
  if(!d||typeof d!=="object") return;
  if(d.type!=="s") return;
  if(d.rs!==stu.rs){ stu.rs=d.rs; stu.tgt=null; }
  const seen=new Set();
  $("chatbar").hidden=!d.ch||d.ph==="end"; document.body.classList.toggle("chaton",!$("chatbar").hidden); $("help").hidden=!$("chatbar").hidden&&innerHeight<520;
  for(const [id,n,c,x,y,s,say] of d.P||[]){ seen.add(id); let p=stu.ps.get(id);
    if(!p){ p={id,x,y,tx:x,ty:y,ph:Math.random()*6}; stu.ps.set(id,p); if(id===stu.id){ stu.me.x=x; stu.me.y=y; } }
    p.n=String(n).slice(0,8); p.c=COLORS.includes(c)?c:"#adb5bd"; p.s=s; p.tx=x; p.ty=y; p.say=say?cleanChat(say):""; }
  for(const id of [...stu.ps.keys()]) if(!seen.has(id)) stu.ps.delete(id);
  const prev=stu.st.ph; stu.st=d; const mine=stu.ps.get(stu.id);
  if(d.ph==="q"&&(prev!=="q"||stu.lastQi!==d.qi)&&mine){ stu.me.x=mine.tx; stu.me.y=mine.ty; stu.tgt=null; stu.lastQi=d.qi; }
  updStatus(prev,d,mine);
}
function updStatus(prev,d,mine){
  const el=$("status"), qc=$("qcard"); el.className="hud glass"; const score=mine?mine.s:0;
  const setQ=(label)=>{ qc.hidden=false; qc.innerHTML=""; const em=document.createElement("em"); em.textContent=label; qc.append(em,document.createTextNode(d.q||"")); };
  if(d.ph==="lobby"){ el.textContent=`${mine?mine.n:""} 입장 완료! 시작할 때까지 돌아다녀 보세요`; qc.hidden=true; $("rank").hidden=true; }
  else if(d.ph==="q"){ el.textContent=`O 또는 X로 이동! · ${Math.ceil(d.t/1000)}초 · ${score}점`; setQ(`${d.qi+1}/${d.qn}`); $("rank").hidden=true; }
  else if(d.ph==="reveal"){ const z=zoneOf(stu.me.x,stu.me.y), ok=z===d.a;
    el.textContent=ok?`정답! +1점 · 지금 ${score}점`:z?`아쉬워요, 정답은 ${d.a} · ${score}점`:`구역 안에 못 들어갔어요 · ${score}점`;
    el.classList.add(ok?"good":"bad"); setQ(`정답 ${d.a}`); if(prev!=="reveal"&&ok) burst3D(); }
  else if(d.ph==="end"){ el.textContent=`끝! 내 점수 ${score}점`; qc.hidden=true;
    if(prev!=="end"){ showRank([...stu.ps.values()].map(p=>({n:p.n,c:p.c,s:p.s,me:p.id===stu.id})),false); burst3D(); } }
}

else {
  initThree();
  $("goTeacher").onclick=()=>startHost(false);
  $("goDemo").onclick=()=>startHost(true);
